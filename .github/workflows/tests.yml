name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        core: ["2026.10.4", "2026.11.0b0", "2026.11.0b1"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "homeassistant==${{ matrix.core }}" "pytest==9.2.0" "pytest-asyncio==1.4.1" "pytest-cov==7.1.0" ruff
          pip check

      - name: Run Ruff lint
        run: ruff check custom_components tests

      - name: Run tests with coverage gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests -q \
            --cov=custom_components/dashboard_entity_checker \
            --cov-report=term-missing \
            --cov-fail-under=90