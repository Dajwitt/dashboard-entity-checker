<script>
const data={"pages": {"de/index": {"title": "Dashboard Entity Checker", "html": "<h1>Dashboard Entity Checker<\/h1>\n<p><strong>Dokumentation für Version 0.3.6<\/strong> · Home-Assistant-Custom-Integration<\/p>\n<p>Dashboard Entity Checker prüft ausgewählte Lovelace-Dashboards auf Entity-Referenzen, die weder in Home Assistants State-Machine noch in der Entity Registry vorhanden sind.<\/p>\n<p>Die Integration liest Dashboard-Konfigurationen über Home Assistants Python-Schnittstellen. Sie liest oder verändert keine <code>.storage<\/code>-Dateien, führt kein JavaScript aus und repariert keine Karten oder Entity-IDs.<\/p>\n<h2>Warum diese Integration?<\/h2>\n<p>In komplexen Custom-Dashboards können fehlende Referenzen in verschachtelten Karten, Decluttering-Card-Templates oder Button-Card-JavaScript verborgen sein. Dashboard Entity Checker löst die ausdrücklich unterstützten Strukturen auf und ergänzt damit allgemeine Wartungswerkzeuge wie <a href=\"https://spook.boo/\" rel=\"noopener noreferrer\">Spook<\/a>. Er ersetzt deren weitergehende Home-Assistant-Prüfungen nicht und ist nicht mit Spook verbunden.<\/p>\n<h2>Wichtigste Funktionen<\/h2>\n<ul><li>ein oder mehrere ausgewählte Dashboards prüfen<\/li><li>direkte Entity-IDs, unterstützte Button-Card-JavaScript-Referenzen und verschachtelte Decluttering-Templates erfassen<\/li><li>vollständige Standorte nach Dashboard und Ansicht melden<\/li><li>bewusst fehlende Entity-IDs transparent ausschließen<\/li><li>einen Result-Sensor, eine optionale persistente Benachrichtigung und ein Änderungs-Event bereitstellen<\/li><li>Teilausfälle einzelner Dashboards sichtbar machen, ohne gültige Ergebnisse anderer Dashboards zu verlieren<\/li><li>redigierte Diagnostik für Fehlerberichte bereitstellen<\/li><\/ul>\n<h2>Schnellstart<\/h2>\n<ol><li><a href=\"#de/installation\" data-page-link=\"installation\">Integration installieren<\/a>.<\/li><li><a href=\"#de/configuration\" data-page-link=\"configuration\">Dashboards und Scan-Optionen konfigurieren<\/a>.<\/li><li><code>sensor.dashboard_entity_checker<\/code> unter <a href=\"#de/sensor\" data-page-link=\"sensor\">Result-Sensor<\/a> prüfen.<\/li><li>Bei Bedarf <code>dashboard_entity_checker.scan_now<\/code> ausführen.<\/li><\/ol>\n<p>Die folgenden Themen decken Einrichtung, Funktionsumfang und Fehleranalyse ab. Für einen neuen Einsatz mit Installation, Konfiguration und Funktionsweise beginnen.<\/p>\n<h2>Dokumentation<\/h2><div class=\"card-grid\"><a class=\"card\" href=\"#de/installation\" data-page-link=\"installation\"><strong>Installation<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/configuration\" data-page-link=\"configuration\"><strong>Konfiguration<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/how-it-works\" data-page-link=\"how-it-works\"><strong>Funktionsweise<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/supported-references\" data-page-link=\"supported-references\"><strong>Unterstützte Referenzen<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/sensor\" data-page-link=\"sensor\"><strong>Result-Sensor<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/services\" data-page-link=\"services\"><strong>Aktion scan_now<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/events\" data-page-link=\"events\"><strong>Events<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/notifications\" data-page-link=\"notifications\"><strong>Benachrichtigungen<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/ignore-list\" data-page-link=\"ignore-list\"><strong>Ausschlüsse<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/diagnostics\" data-page-link=\"diagnostics\"><strong>Diagnostik<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/limitations\" data-page-link=\"limitations\"><strong>Bekannte Grenzen<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/troubleshooting\" data-page-link=\"troubleshooting\"><strong>Fehlerbehebung<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/requirements\" data-page-link=\"requirements\"><strong>Anforderungen<\/strong><span>Öffnen<\/span><\/a><\/div>\n<h2>Sicherheit und Datenschutz<\/h2>\n<p>Die Verarbeitung erfolgt lokal in Home Assistant. Vor dem Veröffentlichen von Diagnostik müssen private Dashboard-Namen, URLs und andere sensible Angaben trotzdem geprüft werden. Zugangsdaten gehören niemals in Issues oder Forenbeiträge.<\/p>"}, "de/installation": {"title": "Installation", "html": "<h1>Installation<\/h1>\n<p>Dashboard Entity Checker ist eine Custom-Integration. Version 0.3.6 ist der aktuelle stabile Release und noch nicht im Standard-HACS-Katalog enthalten.<\/p>\n<h2>Voraussetzungen<\/h2>\n<ul><li>Home Assistant 2026.7.0 oder neuer<\/li><li>HACS 2.0.0 oder neuer für die HACS-Installation<\/li><li>ein Lovelace-Dashboard im Storage-Modus oder ein anderes Dashboard, das Home Assistant über seine Lovelace-Schnittstellen laden kann<\/li><\/ul>\n<h2>Installation über HACS<\/h2>\n<p>Die Angaben oben sind Mindestversionen; aktuelles HACS verwenden. Siehe <a href=\"#de/requirements\" data-page-link=\"requirements\">Teststände und Beta-Marketplace-Grenzen<\/a> zu den getrennten Installationswegen.<\/p>\n<p>HACS muss bereits installiert und funktionsfähig sein.<\/p>\n<p><a href=\"https://my.home-assistant.io/redirect/hacs_repository/?owner=Dajwitt&amp;repository=dashboard-entity-checker&amp;category=integration\" rel=\"noopener noreferrer\">Custom-Repository in Home Assistant öffnen<\/a><\/p>\n<p>Falls der Link nicht funktioniert:<\/p>\n<ol><li>HACS in Home Assistant öffnen.<\/li><li>Das Dreipunkt-Menü oben rechts öffnen.<\/li><li><strong>Custom repositories<\/strong> wählen.<\/li><li>Diese Repository-URL eingeben:<\/li><\/ol>\n<pre><code class=\"language-text\">https://github.com/Dajwitt/dashboard-entity-checker<\/code><\/pre>\n<ol start=\"5\"><li>Kategorie <strong>Integration<\/strong> wählen und das Repository hinzufügen.<\/li><li><strong>Dashboard Entity Checker<\/strong> in HACS öffnen und <strong>Download<\/strong> wählen.<\/li><li>Home Assistant neu starten.<\/li><li>Mit der <a href=\"#de/configuration\" data-page-link=\"configuration\">Konfiguration<\/a> fortfahren.<\/li><\/ol>\n<p>Es ist kein Eintrag in <code>configuration.yaml<\/code> erforderlich.<\/p>\n<h2>Manuelle Installation<\/h2>\n<ol><li>Das neueste GitHub-Release herunterladen.<\/li><li>Sicherstellen, dass der Zielpfad genau so aussieht:<\/li><\/ol>\n<pre><code class=\"language-text\">/config/custom_components/dashboard_entity_checker/manifest.json<\/code><\/pre>\n<ol start=\"3\"><li>Den Ordner <code>custom_components/dashboard_entity_checker<\/code> nach <code>/config/custom_components/<\/code> kopieren.<\/li><li>Home Assistant neu starten.<\/li><li>Mit der <a href=\"#de/configuration\" data-page-link=\"configuration\">Konfiguration<\/a> fortfahren.<\/li><\/ol>\n<h2>Aktualisieren<\/h2>\n<p>Bei HACS-Installationen das Update über HACS herunterladen und Home Assistant anschließend neu starten. Bei manuellen Installationen den Integrationsordner vollständig durch den Ordner aus dem neuen Release ersetzen und ebenfalls neu starten.<\/p>\n<p>Vor einem Update empfiehlt sich ein Home-Assistant-Backup. Die bestehende Config Entry wird beim Update weiterverwendet.<\/p>\n<h2>Deinstallation<\/h2>\n<ol><li>Die Integration unter <strong>Einstellungen → Geräte &amp; Dienste<\/strong> entfernen.<\/li><li>Bei HACS-Installation das Repository über HACS entfernen; bei manueller Installation den Ordner <code>dashboard_entity_checker<\/code> löschen.<\/li><li>Home Assistant neu starten.<\/li><\/ol>\n<p>Das Entfernen der Integration verändert keine Dashboards.<\/p>"}, "de/configuration": {"title": "Konfiguration", "html": "<h1>Konfiguration<\/h1>\n<p>Die Einrichtung und spätere Änderungen erfolgen über Home Assistants Config Flow und Options Flow. Es ist keine YAML-Konfiguration nötig.<\/p>\n<h2>Ersteinrichtung<\/h2>\n<p>Nach Installation und Neustart:<\/p>\n<ol><li><strong>Einstellungen → Geräte &amp; Dienste<\/strong> öffnen.<\/li><li><strong>Integration hinzufügen<\/strong> wählen.<\/li><li>Nach <strong>Dashboard Entity Checker<\/strong> suchen.<\/li><li>Mindestens ein Dashboard auswählen.<\/li><li>Das Scan-Intervall zwischen 1 und 1440 Minuten setzen; Standard sind 5 Minuten.<\/li><li>Persistente Benachrichtigungen aktivieren oder deaktivieren.<\/li><li>Optional alle Home-Assistant-Entities durchsuchen und exakt zu ignorierende Entity-IDs auswählen oder eingeben.<\/li><\/ol>\n<p>Die Einrichtung wird abgewiesen, wenn kein Dashboard gewählt wurde, ein ausgewähltes Dashboard nicht geladen werden kann oder eine Ignore-ID syntaktisch ungültig ist.<\/p>\n<h2>Konfigurationsfelder<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Feld<\/th><th>Typ<\/th><th>Standard<\/th><th>Bedeutung<\/th><\/tr><\/thead><tbody><tr><td>Dashboards<\/td><td>Mehrfachauswahl<\/td><td><code>my-ha-dashboard<\/code><\/td><td>Lovelace-Dashboards, die geprüft werden<\/td><\/tr><tr><td>Scan-Intervall<\/td><td>Ganzzahl 1–1440<\/td><td>5 Minuten<\/td><td>Abstand zwischen automatischen Scans<\/td><\/tr><tr><td>Benachrichtigungen<\/td><td>Ein/Aus<\/td><td>Ein<\/td><td>Persistente Meldung bei aktiven Funden<\/td><\/tr><tr><td>Ignorierte Entity-IDs<\/td><td>Suchbare Mehrfachauswahl<\/td><td>leer<\/td><td>Alle vorhandenen und registrierten Entities durchsuchen oder exakte IDs frei eingeben<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>my-ha-dashboard<\/code> ist nur der technische Standardwert der Integration. In der Auswahl erscheinen die auf der jeweiligen Home-Assistant-Instanz verfügbaren Dashboards.<\/p>\n<p>Die Entity-Auswahl vereinigt die aktuelle State Machine mit der vollständigen Entity Registry. Dadurch werden auch registrierte, deaktivierte, nicht verfügbare oder derzeit zustandslose Entities angeboten. Aktuelle Checker-Funde und bereits gespeicherte Ignore-IDs bleiben ebenfalls sichtbar; vollständig gelöschte IDs können als benutzerdefinierter exakter Wert eingegeben werden.<\/p>\n<h2>Optionen ändern<\/h2>\n<p><strong>Einstellungen → Geräte &amp; Dienste → Dashboard Entity Checker → Konfigurieren<\/strong> öffnen. Dort können alle Felder geändert werden. Nach dem Speichern wird die Config Entry neu geladen; der nächste Scan verwendet sofort die neuen Werte.<\/p>\n<p>Wird die Benachrichtigungsoption ausgeschaltet, entfernt die Integration ihre bestehende persistente Benachrichtigung. Sensor und Event bleiben aktiv.<\/p>\n<h2>Eine Instanz<\/h2>\n<p>Pro Home-Assistant-Instanz ist genau eine Config Entry erlaubt. Diese eine Instanz kann mehrere Dashboards prüfen.<\/p>\n<h2>Migration älterer Konfigurationen<\/h2>\n<p>Konfigurationen aus Config-Flow-Version 1 mit einem einzelnen Dashboard werden automatisch in die Mehrfachauswahl der Version 2 überführt. Das zuvor gewählte Dashboard bleibt erhalten.<\/p>"}, "de/how-it-works": {"title": "Funktionsweise", "html": "<h1>Funktionsweise<\/h1>\n<h2>Ablauf eines Scans<\/h2>\n<pre><code class=\"language-text\">Home Assistant vollständig gestartet\n        ↓\nausgewählte Dashboards über Lovelace laden\n        ↓\nAnsichten und unterstützte Referenzen parsen\n        ↓\nDecluttering-Templates und statische JavaScript-Referenzen auflösen\n        ↓\nReferenzen nach Dashboard und Ansicht zusammenführen\n        ↓\ngegen State-Machine und Entity Registry prüfen\n        ↓\nexakte Ignore-Liste anwenden\n        ↓\nSensor aktualisieren, Benachrichtigung anpassen, ggf. Event senden<\/code><\/pre>\n<h2>Dashboard-Zugriff<\/h2>\n<p>Die Integration verwendet Home Assistants Lovelace-Python-Schnittstellen und lädt die aktuelle Konfiguration mit erzwungener Aktualisierung. Sie greift nicht direkt auf <code>.storage<\/code> zu und schreibt nichts in ein Dashboard. Nur die in der Config Entry ausgewählten Dashboards werden geprüft.<\/p>\n<h2>Wann gilt eine Entity als fehlend?<\/h2>\n<p>Eine Referenz wird nur gemeldet, wenn sie an beiden Stellen fehlt:<\/p>\n<ul><li>kein aktueller State in Home Assistants State-Machine<\/li><li>kein Eintrag in der Entity Registry<\/li><\/ul>\n<p>Dadurch zählen <code>unavailable<\/code>, deaktivierte oder vorübergehend zustandslose Entities nicht als fehlend, solange der Registry-Eintrag noch vorhanden ist.<\/p>\n<h2>Zuordnung und Deduplizierung<\/h2>\n<p>Eine fehlende ID wird einmal ausgegeben. Alle Fundorte bleiben erhalten:<\/p>\n<pre><code class=\"language-json\">{\n  &quot;entity&quot;: &quot;sensor.example_retired_temperature&quot;,\n  &quot;locations&quot;: [\n    {&quot;dashboard&quot;: &quot;example-main&quot;, &quot;views&quot;: [&quot;Overview&quot;, &quot;Climate&quot;]},\n    {&quot;dashboard&quot;: &quot;example-tablet&quot;, &quot;views&quot;: [&quot;Details&quot;]}\n  ]\n}<\/code><\/pre>\n<p>Dashboard-Werte sind URL-Pfade, View-Werte sind die sichtbaren Titel. Mehrere Vorkommen in derselben Ansicht erhöhen den Fundzähler nicht.<\/p>\n<h2>Automatische und manuelle Scans<\/h2>\n<p>Der erste Scan beginnt erst, nachdem Home Assistant vollständig gestartet ist. Danach läuft die Prüfung im konfigurierten Intervall. <code>dashboard_entity_checker.scan_now<\/code> fordert einen sofortigen Scan an. Manuelle und zeitgesteuerte Scans werden nacheinander ausgeführt und überlappen sich nicht.<\/p>\n<h2>Teilausfall<\/h2>\n<p>Kann mindestens ein ausgewähltes Dashboard nicht geladen werden, bleiben die Ergebnisse der erfolgreich geladenen Dashboards erhalten. Der Sensor meldet <code>Teilweise fehlgeschlagen<\/code> und führt Details unter <code>dashboard_errors<\/code> und <code>last_error<\/code> auf.<\/p>\n<p>Ein unvollständiger Scan verändert keine bestehende Fund-Benachrichtigung und sendet kein Result-Changed-Event. So wird ein früheres vollständiges Ergebnis nicht durch unvollständige Daten ersetzt. Der erste anschließende vollständige Scan wird wieder als Vergleichsbasis verwendet und sendet ebenfalls noch kein Änderungs-Event.<\/p>\n<p>Können alle ausgewählten Dashboards nicht geladen werden, schlägt der Coordinator-Lauf fehl. Der Sensor bleibt verfügbar, zeigt den Fehlerzustand und erhält die letzte erfolgreiche Datenbasis, soweit Home Assistant sie noch hält.<\/p>"}, "de/supported-references": {"title": "Unterstützte Referenzen", "html": "<h1>Unterstützte Referenzen<\/h1>\n<p>Der Checker untersucht String-Werte in der geladenen Dashboard-Konfiguration. Er erkennt direkte Entity-IDs, unterstützte statische Zugriffe in Button-Card-JavaScript und Entity-IDs nach der Auflösung von Decluttering-Card-Templates.<\/p>\n<h2>Unterstützte Domains<\/h2>\n<pre><code class=\"language-text\">alarm_control_panel, automation, binary_sensor, button, calendar,\ncamera, climate, cover, device_tracker, fan, group, humidifier,\ninput_boolean, input_button, input_datetime, input_number,\ninput_select, input_text, light, lock, media_player, number,\nperson, remote, scene, script, select, sensor, switch,\ntimer, update, vacuum, weather, zone<\/code><\/pre>\n<h2>Direkte Referenzen<\/h2>\n<p>Ein String, der vollständig wie eine unterstützte Entity-ID aussieht, wird unabhängig vom umgebenden YAML-Schlüssel erfasst:<\/p>\n<pre><code class=\"language-yaml\">type: entities\nentities:\n  - entity: sensor.example_room_temperature\n  - light.example_ceiling\nvariables:\n  - speaker: media_player.example_speaker<\/code><\/pre>\n<p>Werte der Schlüssel <code>service<\/code> und <code>perform_action<\/code>, Kartentypen, Icons, URLs und CSS-Werte werden gefiltert. Die Prüfung ist auf Referenzen ausgerichtet und interpretiert nicht die Semantik jeder Custom Card. Für den modernen direkten Schlüssel <code>action<\/code> gilt derzeit eine <a href=\"#de/limitations\" data-page-link=\"limitations\">bekannte Grenze<\/a>.<\/p>\n<h2>Fehlerhafte zusätzliche Punkt-Suffixe<\/h2>\n<p>Seit Version 0.3.5 wird ein vollständig entityähnlicher Scalar mit einem versehentlich angehängten weiteren Punkt-Suffix als kompletter fehlerhafter Wert erfasst:<\/p>\n<pre><code class=\"language-yaml\">variables:\n  - contact: binary_sensor.example_window_contact.example_door_contact<\/code><\/pre>\n<p>Der Checker meldet <code>binary_sensor.example_window_contact.example_door_contact<\/code> als fehlende Referenz. Er verkürzt den Wert nicht auf das möglicherweise existierende Präfix <code>binary_sensor.example_window_contact<\/code>. Dieser Fall kann entstehen, wenn Autovervollständigung mitten in einer Entity-ID verwendet wird.<\/p>\n<h2>Button-Card-JavaScript<\/h2>\n<p>Blöcke in der Form <code>[[[ ... ]]]<\/code> werden als Text analysiert, nicht ausgeführt. Unterstützt sind unter anderem:<\/p>\n<pre><code class=\"language-javascript\">states[&#x27;sensor.example_humidity&#x27;]\nstates[&quot;binary_sensor.example_window&quot;]\nstates.light.example_ceiling<\/code><\/pre>\n<p>Statische Entity-IDs in Strings und Kommentaren innerhalb des JavaScript-Blocks werden ebenfalls erkannt:<\/p>\n<pre><code class=\"language-javascript\">// Remove obsolete sensor.example_legacy_value\nreturn states[&#x27;sensor.example_humidity&#x27;].state;<\/code><\/pre>\n<p>Kommentare werden bewusst gescannt, weil dort häufig alte Referenzen verbleiben.<\/p>\n<h2>JavaScript-Filter<\/h2>\n<p>Nicht als Referenz behandelt werden unter anderem:<\/p>\n<ul><li>Service- oder Action-Werte wie <code>service: sensor.example_placeholder<\/code><\/li><li>URLs wie <code>https://sensor.example.invalid/path<\/code><\/li><li>CSS-Selektoren wie <code>.sensor.example_value<\/code><\/li><li>Objekt-Properties wie <code>object.sensor.example_value<\/code><\/li><li>dynamische Zugriffe über berechnete Variablen wie <code>states[entityId]<\/code><\/li><\/ul>\n<p>Explizite <code>states[...]<\/code>- und <code>states.domain.object<\/code>-Zugriffe bleiben auch in Feldern wie <code>styles<\/code>, <code>url<\/code> oder <code>icon<\/code> sichtbar.<\/p>\n<h2>Decluttering-Card-Templates<\/h2>\n<p>Der Checker liest <code>decluttering_templates<\/code>, ersetzt <code>[[variable]]<\/code>-Platzhalter und prüft die daraus entstehenden Kartenobjekte. Defaults werden zuerst angewendet und durch Werte der Karteninstanz überschrieben.<\/p>\n<pre><code class=\"language-yaml\">decluttering_templates:\n  example_security_row:\n    default:\n      - secondary: binary_sensor.example_secondary_contact\n    card:\n      type: entities\n      entities:\n        - &#x27;[[primary]]&#x27;\n        - &#x27;[[secondary]]&#x27;\n\nviews:\n  - title: Security\n    cards:\n      - type: custom:decluttering-card\n        template: example_security_row\n        variables:\n          - primary: binary_sensor.example_primary_contact<\/code><\/pre>\n<p>Beide IDs werden der Ansicht <code>Security<\/code> zugeordnet. Die Auflösung unterstützt vollständige verschachtelte Kartenobjekte und rekursive Decluttering-Aufrufe bis maximal 20 Ebenen.<\/p>\n<h2>Template-Diagnostik<\/h2>\n<p>Auflösungsprobleme werden separat unter <code>template_diagnostics<\/code> gemeldet:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Code<\/th><th>Bedeutung<\/th><\/tr><\/thead><tbody><tr><td><code>missing_template<\/code><\/td><td>Template-Name fehlt oder existiert nicht<\/td><\/tr><tr><td><code>circular_template<\/code><\/td><td>zirkuläre Template-Kette erkannt<\/td><\/tr><tr><td><code>max_template_depth<\/code><\/td><td>maximale Tiefe von 20 erreicht<\/td><\/tr><tr><td><code>unknown_variable<\/code><\/td><td>benötigter Platzhalterwert fehlt<\/td><\/tr><tr><td><code>invalid_variables<\/code><\/td><td>Defaults oder Variablen besitzen eine ungültige Struktur<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Eine Template-Diagnose ist nicht automatisch eine fehlende Entity. Der restliche Dashboard-Scan läuft weiter.<\/p>"}, "de/sensor": {"title": "Result-Sensor", "html": "<h1>Result-Sensor<\/h1>\n<p>Die Integration erstellt eine Sensor-Entity. Der Standardname ist <code>sensor.dashboard_entity_checker<\/code>; Home Assistant kann die Entity-ID bei Namenskonflikten oder nach manueller Umbenennung abweichend vergeben.<\/p>\n<h2>Zustand<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Wert<\/th><th>Bedeutung<\/th><\/tr><\/thead><tbody><tr><td><code>0<\/code><\/td><td>keine aktuell fehlenden, nicht ignorierten Entity-IDs<\/td><\/tr><tr><td>positive Ganzzahl<\/td><td>Anzahl eindeutiger aktiver Funde<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Der numerische Zustand bleibt auch bei einem partiellen Dashboard-Fehler das Ergebnis der erfolgreich geladenen Dashboards. Deshalb müssen für eine vollständige Bewertung zusätzlich <code>status<\/code>, <code>dashboard_loaded<\/code> und <code>dashboard_errors<\/code> geprüft werden.<\/p>\n<h2>Attribute<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Attribut<\/th><th>Typ<\/th><th>Bedeutung<\/th><\/tr><\/thead><tbody><tr><td><code>dashboard<\/code><\/td><td>String<\/td><td>erstes konfiguriertes Dashboard, Kompatibilitätsfeld<\/td><\/tr><tr><td><code>dashboards<\/code><\/td><td>Liste<\/td><td>alle konfigurierten Dashboard-URL-Pfade<\/td><\/tr><tr><td><code>dashboards_loaded<\/code><\/td><td>Liste<\/td><td>im letzten Lauf erfolgreich geladene Dashboards<\/td><\/tr><tr><td><code>dashboard_errors<\/code><\/td><td>Liste<\/td><td>nicht geladene Dashboards mit Fehlermeldung<\/td><\/tr><tr><td><code>scan_interval_minutes<\/code><\/td><td>Zahl<\/td><td>konfiguriertes Scan-Intervall<\/td><\/tr><tr><td><code>dashboard_loaded<\/code><\/td><td>Boolean<\/td><td><code>true<\/code>, wenn alle Dashboards geladen wurden<\/td><\/tr><tr><td><code>status<\/code><\/td><td>String<\/td><td>zusammengefasster Laufstatus<\/td><\/tr><tr><td><code>missing_entities<\/code><\/td><td>Liste<\/td><td>aktive fehlende IDs mit Standorten<\/td><\/tr><tr><td><code>ignored_entities<\/code><\/td><td>Liste<\/td><td>konfigurierte exakte Ignore-IDs<\/td><\/tr><tr><td><code>ignored_matches<\/code><\/td><td>Liste<\/td><td>tatsächlich gefundene, aber ignorierte IDs<\/td><\/tr><tr><td><code>checked_entities<\/code><\/td><td>Zahl<\/td><td>eindeutige Referenzen vor Existenzprüfung<\/td><\/tr><tr><td><code>templates_resolved<\/code><\/td><td>Zahl<\/td><td>insgesamt aufgelöste Decluttering-Templates<\/td><\/tr><tr><td><code>template_diagnostics<\/code><\/td><td>Liste<\/td><td>nicht fatale Auflösungsprobleme<\/td><\/tr><tr><td><code>views<\/code><\/td><td>Objekt<\/td><td>geladene View-Titel je Dashboard<\/td><\/tr><tr><td><code>views_scanned<\/code><\/td><td>Zahl<\/td><td>Summe der gescannten Views<\/td><\/tr><tr><td><code>last_scan<\/code><\/td><td>String<\/td><td>ISO-Zeitpunkt des letzten abgeschlossenen Scans<\/td><\/tr><tr><td><code>last_error<\/code><\/td><td>String oder <code>null<\/code><\/td><td>letzter Dashboard- oder Coordinator-Fehler<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Beispiel für einen Fund<\/h2>\n<pre><code class=\"language-json\">[\n  {\n    &quot;entity&quot;: &quot;sensor.example_retired_temperature&quot;,\n    &quot;locations&quot;: [\n      {&quot;dashboard&quot;: &quot;example-main&quot;, &quot;views&quot;: [&quot;Overview&quot;, &quot;Climate&quot;]},\n      {&quot;dashboard&quot;: &quot;example-tablet&quot;, &quot;views&quot;: [&quot;Details&quot;]}\n    ]\n  }\n]<\/code><\/pre>\n<h2>Statuswerte<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Status<\/th><th>Bedeutung<\/th><\/tr><\/thead><tbody><tr><td><code>OK<\/code><\/td><td>vollständiger Scan ohne aktive Funde<\/td><\/tr><tr><td><code>Fehler gefunden<\/code><\/td><td>vollständiger Scan mit aktiven Funden<\/td><\/tr><tr><td><code>Teilweise fehlgeschlagen<\/code><\/td><td>mindestens ein Dashboard nicht ladbar, mindestens eines erfolgreich<\/td><\/tr><tr><td><code>Fehler<\/code><\/td><td>der letzte Coordinator-Lauf ist vollständig fehlgeschlagen<\/td><\/tr><tr><td><code>Warte auf ersten Scan<\/code><\/td><td>Integration geladen, erster Scan noch nicht abgeschlossen<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Die Statuswerte stammen derzeit aus der Integration und sind deutsch, unabhängig von der gewählten Oberflächensprache.<\/p>"}, "de/services": {"title": "Aktion `scan_now`", "html": "<h1>Aktion <code>scan_now<\/code><\/h1>\n<h2><code>dashboard_entity_checker.scan_now<\/code><\/h2>\n<p>Die Aktion fordert sofort einen Scan aller konfigurierten Dashboards an. Sie besitzt keine Parameter.<\/p>\n<h2>Entwicklerwerkzeuge<\/h2>\n<p>Unter <strong>Entwicklerwerkzeuge → Aktionen<\/strong>:<\/p>\n<pre><code class=\"language-yaml\">action: dashboard_entity_checker.scan_now<\/code><\/pre>\n<h2>Script-Beispiel<\/h2>\n<pre><code class=\"language-yaml\">script:\n  example_dashboard_check:\n    alias: &quot;Beispiel: Dashboard-Prüfung&quot;\n    sequence:\n      - action: dashboard_entity_checker.scan_now<\/code><\/pre>\n<h2>Automations-Beispiel<\/h2>\n<pre><code class=\"language-yaml\">automation:\n  - alias: &quot;Beispiel: Dashboard-Prüfung anfordern&quot;\n    triggers:\n      - trigger: time\n        at: &quot;03:15:00&quot;\n    actions:\n      - action: dashboard_entity_checker.scan_now<\/code><\/pre>\n<p>Für normale Nutzung ist diese Automation nicht erforderlich, weil die Integration bereits automatisch im eingestellten Intervall scannt.<\/p>\n<h2>Ausführung und Fehler<\/h2>\n<p>Ein manueller Aufruf wartet auf einen bereits laufenden Scan; parallele Scans werden verhindert. Können alle ausgewählten Dashboards nicht geladen werden oder tritt ein vollständiger Coordinator-Fehler auf, schlägt der Action-Aufruf mit einem Home-Assistant-Fehler fehl.<\/p>\n<p>Bei einem Teilausfall wird die Action erfolgreich beendet. Details stehen anschließend in <code>dashboard_errors<\/code> und <code>last_error<\/code>.<\/p>"}, "de/events": {"title": "Events", "html": "<h1>Events<\/h1>\n<h2><code>dashboard_entity_checker_result_changed<\/code><\/h2>\n<p>Nach einem vollständigen Baseline-Scan sendet die Integration dieses Event, wenn sich das vollständige aktive Ergebnis ändert.<\/p>\n<h2>Wann wird es gesendet?<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Situation<\/th><th>Event<\/th><\/tr><\/thead><tbody><tr><td>aktives Ergebnis ändert sich nach Baseline<\/td><td>ja<\/td><\/tr><tr><td>Ergebnis bleibt identisch<\/td><td>nein<\/td><\/tr><tr><td>erster vollständiger Scan erstellt Baseline<\/td><td>nein<\/td><\/tr><tr><td>mindestens ein Dashboard konnte nicht geladen werden<\/td><td>nein<\/td><\/tr><tr><td>nur <code>ignored_matches<\/code> ändern sich, aktive Liste bleibt gleich<\/td><td>nein<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Ein Standortwechsel zählt als Ergebnisänderung, weil <code>missing_entities<\/code> einschließlich der Standorte verglichen wird. <code>added_entities<\/code> und <code>removed_entities<\/code> können dabei trotzdem leer sein.<\/p>\n<h2>Event-Daten<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Feld<\/th><th>Typ<\/th><th>Bedeutung<\/th><\/tr><\/thead><tbody><tr><td><code>dashboards<\/code><\/td><td>Liste<\/td><td>konfigurierte Dashboard-URL-Pfade<\/td><\/tr><tr><td><code>previous_count<\/code><\/td><td>Zahl<\/td><td>vorherige Anzahl aktiver IDs<\/td><\/tr><tr><td><code>current_count<\/code><\/td><td>Zahl<\/td><td>aktuelle Anzahl aktiver IDs<\/td><\/tr><tr><td><code>added_entities<\/code><\/td><td>Liste<\/td><td>neu fehlende IDs, sortiert<\/td><\/tr><tr><td><code>removed_entities<\/code><\/td><td>Liste<\/td><td>nicht mehr fehlende IDs, sortiert<\/td><\/tr><tr><td><code>missing_entities<\/code><\/td><td>Liste<\/td><td>vollständiges aktuelles Ergebnis mit Standorten<\/td><\/tr><tr><td><code>scan_time<\/code><\/td><td>String<\/td><td>ISO-Zeitpunkt des Scans<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Automations-Beispiel<\/h2>\n<pre><code class=\"language-yaml\">automation:\n  - alias: &quot;Beispiel: Dashboard-Funde geändert&quot;\n    triggers:\n      - trigger: event\n        event_type: dashboard_entity_checker_result_changed\n    conditions:\n      - condition: template\n        value_template: &quot;{{ trigger.event.data.added_entities | count &gt; 0 }}&quot;\n    actions:\n      - action: persistent_notification.create\n        data:\n          title: &quot;Neue Dashboard-Referenzen&quot;\n          message: &gt;\n            {{ trigger.event.data.added_entities | join(&#x27;, &#x27;) }}<\/code><\/pre>\n<p>Das Beispiel nutzt absichtlich keine gerätespezifische Notify-Action. Für produktive Automationen sollte außerdem berücksichtigt werden, dass ein reiner Standortwechsel ein Event ohne hinzugefügte oder entfernte IDs auslösen kann. Nach einem partiellen Scan wird der nächste vollständige Scan als neue Vergleichsbasis behandelt und sendet ebenfalls noch kein Event.<\/p>"}, "de/notifications": {"title": "Benachrichtigungen", "html": "<h1>Benachrichtigungen<\/h1>\n<p>Wenn die Option aktiviert ist, verwaltet die Integration eine einzige persistente Benachrichtigung mit der festen ID <code>dashboard_entity_checker_missing_entities<\/code>.<\/p>\n<h2>Verhalten<\/h2>\n<ul><li>Ein vollständiger Scan mit Funden erstellt oder aktualisiert die Meldung.<\/li><li>Ein identisches Ergebnis erzeugt kein unnötiges Update.<\/li><li>Ein vollständiger sauberer Scan entfernt die Meldung.<\/li><li>Das Deaktivieren der Option entfernt sie ebenfalls.<\/li><li>Ein partieller Scan verändert die bestehende Meldung nicht.<\/li><li>Titel und Meldungstext sind abhängig von Home Assistants Sprache deutsch oder englisch.<\/li><\/ul>\n<h2>Gruppierung<\/h2>\n<p>Die Meldung gruppiert nach Dashboard und Ansicht. Pro Ansicht werden höchstens acht Entity-IDs gezeigt; weitere Funde erscheinen als Restzähler. Die vollständige, ungekürzte Liste bleibt im Sensorattribut <code>missing_entities<\/code>.<\/p>\n<pre><code class=\"language-text\">Dashboard Entity Checker: 2 fehlende Entities\n\n2 fehlende Entities in 3 Ansichten\n\n### `example-main`\n\n**Overview** · 1\n- `sensor.example_retired_temperature`\n\n**Security** · 1\n- `binary_sensor.example_old_contact`\n\n### `example-tablet`\n\n**Details** · 1\n- `sensor.example_retired_temperature`\n\nVollständige Liste: Sensorattribut `missing_entities`.<\/code><\/pre>\n<p>Die Zahl im Titel zählt eindeutige aktive Entity-IDs. Dieselbe ID kann darunter an mehreren Standorten erscheinen.<\/p>\n<h2>Teilausfälle<\/h2>\n<p>Kann ein ausgewähltes Dashboard nicht geladen werden, ist das Ergebnis unvollständig. Eine vorhandene Fundmeldung wird deshalb weder entfernt noch mit dem Teilergebnis überschrieben. Der Teilausfall selbst steht im Result-Sensor und in der Diagnostik.<\/p>\n<h2>Keine zusätzlichen Duplikate<\/h2>\n<p>Die Integration verwendet immer dieselbe Notification-ID. Sie erstellt nicht bei jedem Intervall eine neue Meldung. Wer zusätzliche Push-Nachrichten benötigt, kann das Result-Changed-Event in einer eigenen Automation verwenden.<\/p>"}, "de/ignore-list": {"title": "Ausschlüsse", "html": "<h1>Ausschlüsse<\/h1>\n<p>Exakte Entity-IDs, die bewusst nicht als aktive Funde erscheinen sollen, können im Config Flow oder Options Flow ausgewählt oder eingegeben werden.<\/p>\n<h2>Auswahl<\/h2>\n<p>Das suchbare Mehrfachauswahlfeld enthält:<\/p>\n<ul><li>alle Entity-IDs aus Home Assistants aktueller State Machine,<\/li><li>alle Einträge der Entity Registry, einschließlich registrierter Entities ohne aktuellen State,<\/li><li>aktuelle und bereits ignorierte Checker-Funde sowie gespeicherte Ignore-IDs.<\/li><\/ul>\n<p>Nach Domain, Objekt-ID oder einem vollständigen Wert suchen und jeden gewünschten Eintrag auswählen. Existiert eine ID nicht mehr, kann sie vollständig eingegeben und über <strong>Benutzerdefiniertes Element hinzufügen<\/strong> übernommen werden:<\/p>\n<pre><code class=\"language-text\">sensor.example_intentionally_missing<\/code><\/pre>\n<p>Beim Speichern muss jeder Wert eine syntaktisch gültige Home-Assistant-Entity-ID sein. Duplikate werden zusammengeführt. Die ID muss nicht existieren; genau dafür bleibt die freie exakte Eingabe verfügbar.<\/p>\n<h2>Exakte Übereinstimmung<\/h2>\n<p>Ausschlüsse gelten nur für die komplette ID. Es gibt keine Wildcards, regulären Ausdrücke, Domain-Filter oder Teilstring-Suche.<\/p>\n<pre><code class=\"language-text\">sensor.example_room<\/code><\/pre>\n<p>ignoriert nicht <code>sensor.example_room_temperature<\/code>.<\/p>\n<h2>Transparenz<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Attribut<\/th><th>Inhalt<\/th><\/tr><\/thead><tbody><tr><td><code>missing_entities<\/code><\/td><td>aktive, nicht ignorierte Funde<\/td><\/tr><tr><td><code>ignored_entities<\/code><\/td><td>vollständige konfigurierte Liste<\/td><\/tr><tr><td><code>ignored_matches<\/code><\/td><td>derzeit tatsächlich gefundene und ausgeschlossene IDs mit Standorten<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Eine konfigurierte ID, die im Scan nicht fehlt, erscheint nur unter <code>ignored_entities<\/code>, nicht unter <code>ignored_matches<\/code>.<\/p>\n<h2>Beispiel<\/h2>\n<pre><code class=\"language-json\">{\n  &quot;missing_entities&quot;: [\n    {&quot;entity&quot;: &quot;sensor.example_active_problem&quot;, &quot;locations&quot;: []}\n  ],\n  &quot;ignored_entities&quot;: [&quot;binary_sensor.example_expected_missing&quot;],\n  &quot;ignored_matches&quot;: [\n    {&quot;entity&quot;: &quot;binary_sensor.example_expected_missing&quot;, &quot;locations&quot;: []}\n  ]\n}<\/code><\/pre>\n<h2>Liste leeren<\/h2>\n<p>Das Feld im Options Flow vollständig leeren und speichern. Die Integration entfernt dann alle Ausschlüsse. Sind Benachrichtigungen aktiv, wird das nächste vollständige Scanergebnis entsprechend aktualisiert.<\/p>"}, "de/diagnostics": {"title": "Diagnostik", "html": "<h1>Diagnostik<\/h1>\n<p>Diagnostik wird unter <strong>Einstellungen → Geräte &amp; Dienste → Dashboard Entity Checker → Dreipunkt-Menü → Diagnostik herunterladen<\/strong> erzeugt. Sie enthält Konfiguration und das letzte Scanergebnis in einer Form, die für Fehlerberichte geeignet ist.<\/p>\n<h2>Enthaltene Daten<\/h2>\n<ul><li>Integrationsversion<\/li><li>konfigurierte, geladene und fehlerhafte Dashboards<\/li><li>Scan-Intervall und Ladezustand<\/li><li>Ansichten und Anzahl geprüfter Referenzen<\/li><li>aktive Funde, konfigurierte Ausschlüsse und <code>ignored_matches<\/code><\/li><li>aufgelöste Decluttering-Templates und Template-Diagnosen<\/li><li>Zeitpunkt und Fehlertext des letzten Scans<\/li><\/ul>\n<p>Ist der Coordinator beim Download nicht verfügbar, erzeugt die Integration einen reduzierten Diagnostiksatz mit Konfigurationswerten, leeren Ergebnislisten und dem Hinweis <code>Coordinator ist nicht verfügbar.<\/code><\/p>\n<h2>Beispielauszug<\/h2>\n<pre><code class=\"language-json\">{\n  &quot;integration_version&quot;: &quot;0.3.6&quot;,\n  &quot;dashboards&quot;: [&quot;example-main&quot;, &quot;example-tablet&quot;],\n  &quot;dashboards_loaded&quot;: [&quot;example-main&quot;],\n  &quot;dashboard_errors&quot;: [\n    {&quot;dashboard&quot;: &quot;example-tablet&quot;, &quot;error&quot;: &quot;Dashboard could not be loaded&quot;}\n  ],\n  &quot;entities_checked&quot;: 42,\n  &quot;missing_entities&quot;: [\n    {\n      &quot;entity&quot;: &quot;sensor.example_retired_temperature&quot;,\n      &quot;locations&quot;: [\n        {&quot;dashboard&quot;: &quot;example-main&quot;, &quot;views&quot;: [&quot;Climate&quot;]}\n      ]\n    }\n  ],\n  &quot;template_diagnostics&quot;: []\n}<\/code><\/pre>\n<h2>Redaktion<\/h2>\n<p>Felder mit den Schlüsseln <code>access_token<\/code>, <code>token<\/code> und <code>password<\/code> werden über Home Assistants Diagnosefunktion geschwärzt. Das ist eine zusätzliche Schutzmaßnahme, ersetzt aber keine manuelle Prüfung.<\/p>\n<h2>Vor dem Hochladen<\/h2>\n<ul><li>Datei vollständig ansehen.<\/li><li>Private Dashboard-Namen, View-Titel und Entity-IDs bei Bedarf anonymisieren.<\/li><li>Keine Tokens, Passwörter, privaten URLs oder internen Netzwerkadressen veröffentlichen.<\/li><li>Im Issue Integrationsversion, Home-Assistant-Version und klare Reproduktionsschritte nennen.<\/li><\/ul>"}, "de/limitations": {"title": "Bekannte Grenzen", "html": "<h1>Bekannte Grenzen<\/h1>\n<h2>JavaScript wird nicht ausgeführt<\/h2>\n<p>Button-Card-JavaScript wird statisch als Text untersucht. Statische Zugriffe wie <code>states['sensor.example_humidity']<\/code> sind sichtbar. Dynamisch erzeugte IDs können nicht sicher berechnet werden:<\/p>\n<pre><code class=\"language-javascript\">const entityId = `sensor.${room}_temperature`;\nreturn states[entityId].state;<\/code><\/pre>\n<p>Der Checker führt keinen JavaScript-Code aus und wertet keine Variablen, Funktionen oder Laufzeitbedingungen aus.<\/p>\n<h2>Kommentare werden mitgeprüft<\/h2>\n<p>Entity-ähnliche Werte in JavaScript-Kommentaren werden bewusst erfasst. Ein auskommentierter veralteter Verweis kann daher als Fund erscheinen. Entferne ihn aus dem Dashboard oder trage die exakte ID bewusst in die Ignore-Liste ein.<\/p>\n<h2>Custom Cards<\/h2>\n<p>Direkte statische Entity-IDs in ihrer Konfiguration können erkannt werden. Eigene Referenzformate, externe Dateien oder IDs, die erst durch den JavaScript-Code einer Custom Card erzeugt werden, sind dagegen nicht allgemein auflösbar.<\/p>\n<h2>Direkter <code>action<\/code>-Schlüssel<\/h2>\n<p>Die direkten Scalar-Schlüssel <code>service<\/code> und <code>perform_action<\/code> werden als Dienstnamen übersprungen. Der modernere Schlüssel <code>action<\/code> wird in normalen Dashboard-Objekten derzeit nicht auf dieselbe Weise ausgeschlossen. Ein entityähnlicher Action-Name wie <code>light.example_turn_on<\/code> kann deshalb fälschlich als Entity-Referenz erscheinen. Bis der Parser dies angleicht, muss ein solcher Fund am angegebenen Dashboard-Ort manuell geprüft werden.<\/p>\n<h2>Decluttering Card<\/h2>\n<ul><li>nur vorhandene <code>decluttering_templates<\/code> der geladenen Dashboard-Konfiguration können aufgelöst werden<\/li><li>unbekannte Variablen werden diagnostiziert, nicht geraten<\/li><li>zirkuläre Aufrufe werden abgebrochen<\/li><li>die maximale rekursive Tiefe beträgt 20<\/li><li><code>[[variable]]<\/code> wird unterstützt; Button-Card-JavaScript <code>[[[ ... ]]]<\/code> ist ein getrennter Analyseweg<\/li><\/ul>\n<h2>Existenzprüfung<\/h2>\n<p>Eine Entity mit Registry-Eintrag gilt nicht als fehlend, auch wenn sie deaktiviert, <code>unavailable<\/code> oder ohne aktuellen State ist. Die Integration prüft Referenzexistenz, nicht Verfügbarkeit oder Gerätezustand.<\/p>\n<h2>Kein Reparaturwerkzeug<\/h2>\n<p>Der Checker schreibt keine Dashboard-Konfiguration und bietet keine automatische Korrektur. Fundort und vollständige ID sollen eine manuelle, kontrollierte Reparatur erleichtern.<\/p>\n<h2>Kein vollständiger Home-Assistant-Audit<\/h2>\n<p>Geprüft werden nur ausgewählte Dashboards und die ausdrücklich unterstützten Referenzformen. Automationen, Scripts, Template-Helfer und andere Home-Assistant-Konfigurationen gehören nicht zu diesem Projektumfang.<\/p>"}, "de/troubleshooting": {"title": "Fehlerbehebung", "html": "<h1>Fehlerbehebung<\/h1>\n<h2>Sensor bleibt bei <code>Warte auf ersten Scan<\/code><\/h2>\n<p>Der erste Scan startet erst nach Home Assistants vollständigem Start. Kurz nach einem Neustart ist der Zustand normal. Dauert er an, <code>dashboard_entity_checker.scan_now<\/code> unter <strong>Entwicklerwerkzeuge → Aktionen<\/strong> ausführen und die Home-Assistant-Logs prüfen.<\/p>\n<h2><code>dashboard_errors<\/code> enthält Einträge<\/h2>\n<ol><li><code>last_error<\/code> und den einzelnen Fehlertext prüfen.<\/li><li>Kontrollieren, ob der Dashboard-URL-Pfad noch existiert.<\/li><li>Das Dashboard in Home Assistant öffnen.<\/li><li>Die Integrationsoptionen öffnen und eine ungültige Auswahl entfernen oder neu wählen.<\/li><li>Erneut scannen.<\/li><\/ol>\n<p>Bei Teilausfällen bleiben Ergebnisse anderer Dashboards sichtbar. Sie sind aber kein vollständiger Gesamtscan.<\/p>\n<h2><code>template_diagnostics<\/code> enthält Einträge<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Code<\/th><th>Typische Ursache<\/th><\/tr><\/thead><tbody><tr><td><code>missing_template<\/code><\/td><td>Name fehlt oder Template wurde umbenannt<\/td><\/tr><tr><td><code>circular_template<\/code><\/td><td>Templates rufen sich gegenseitig auf<\/td><\/tr><tr><td><code>max_template_depth<\/code><\/td><td>Kette ist tiefer als 20 Ebenen<\/td><\/tr><tr><td><code>unknown_variable<\/code><\/td><td>benötigte Variable oder Default fehlt<\/td><\/tr><tr><td><code>invalid_variables<\/code><\/td><td><code>default<\/code> oder <code>variables<\/code> ist strukturell ungültig<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Die Diagnose enthält Dashboard, Ansicht, Template und soweit möglich Variable oder Detail. Die Quellkonfiguration dort prüfen; der Checker verändert sie nicht.<\/p>\n<h2>Erwartete fehlende ID wird nicht gemeldet<\/h2>\n<ul><li>Die ID besitzt noch einen Entity-Registry-Eintrag.<\/li><li>Die ID steht unter <code>ignored_entities<\/code>; bei echtem Treffer erscheint sie unter <code>ignored_matches<\/code>.<\/li><li>Das betroffene Dashboard ist nicht ausgewählt oder konnte nicht geladen werden.<\/li><li>Die Referenz wird dynamisch erzeugt oder liegt in einem nicht unterstützten Custom-Card-Format.<\/li><li>Die ID verwendet eine nicht unterstützte Domain.<\/li><\/ul>\n<p>Siehe <a href=\"#de/supported-references\" data-page-link=\"supported-references\">Unterstützte Referenzen<\/a> und <a href=\"#de/limitations\" data-page-link=\"limitations\">Bekannte Grenzen<\/a>.<\/p>\n<h2>Offensichtlich falscher Wert wird nur teilweise erkannt<\/h2>\n<p>Version 0.3.5 oder neuer installieren. Diese Version behandelt versehentlich angehängte Punkt-Suffixe als vollständigen fehlerhaften Scalar. Nach dem Update Home Assistant neu starten und manuell scannen.<\/p>\n<h2>Entityähnlicher Action-Name wird gemeldet<\/h2>\n<p>Direkte Werte unter dem modernen Dashboard-Schlüssel <code>action<\/code> werden derzeit nicht wie <code>service<\/code> und <code>perform_action<\/code> ausgeschlossen. Dadurch kann zum Beispiel <code>light.example_turn_on<\/code> als fehlende Entity erscheinen. Den Fundort prüfen; diese bekannte Grenze ist unter <a href=\"#de/limitations\" data-page-link=\"limitations\">Bekannte Grenzen<\/a> beschrieben.<\/p>\n<h2>Benachrichtigung fehlt oder ist unverändert<\/h2>\n<ul><li>Benachrichtigungsoption prüfen.<\/li><li><code>missing_entities<\/code> kontrollieren.<\/li><li>Bei einem Teilausfall bleibt die vorherige Benachrichtigung absichtlich unverändert.<\/li><li>Ein identisches vollständiges Ergebnis erzeugt kein unnötiges Update.<\/li><\/ul>\n<h2>Fehlerbericht erstellen<\/h2>\n<ol><li>Neueste Version installieren und Home Assistant neu starten.<\/li><li>Einen manuellen Scan ausführen.<\/li><li>Sensorattribute und Home-Assistant-Logs prüfen.<\/li><li><a href=\"#de/diagnostics\" data-page-link=\"diagnostics\">Diagnostik<\/a> herunterladen und redigieren.<\/li><li>Ein Issue unter <a href=\"https://github.com/Dajwitt/dashboard-entity-checker/issues\" rel=\"noopener noreferrer\">GitHub Issues<\/a> mit klaren Schritten und erwartetem Ergebnis öffnen.<\/li><\/ol>\n<p>Keine Zugangsdaten, privaten URLs oder echten privaten Entity-IDs öffentlich posten.<\/p>"}, "de/requirements": {"title": "Anforderungen", "html": "<h1>Anforderungen<\/h1>\n<h2>Unterstützte Versionen<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Komponente<\/th><th>Mindestversion<\/th><\/tr><\/thead><tbody><tr><td>Home Assistant<\/td><td>2026.7.0<\/td><\/tr><tr><td>HACS für HACS-Installation<\/td><td>2.0.0<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Version 0.3.6 ist der aktuelle stabile Release.<\/p>\n<p>Die Tabelle nennt erhaltene Mindestversionen, nicht die neuesten Teststände; eine aktuelle HACS-Version verwenden. Reguläre CI nutzt HA <strong>2026.10.4<\/strong> statt des alten Test-Pins 2026.7.2. Separate echte Core-Tests unter <strong>2026.11.0b0/b1<\/strong> bestanden je 87 bestehende und 7 Runtime-Tests (94 bestanden, 96,32 % Coverage). Beide November-Versionen bleiben Beta. Kein inkompatibles Oktober-HA-Pytest-Plugin wurde in diese Umgebungen gezwungen. CI wiederholt außerdem die 87 bestehenden Tests unter b0/b1; die sieben zusätzlichen Core-Harnesstests bleiben eine separate lokale Abnahme, nicht Teil dieser CI-Zahl.<\/p>\n<p>Gezielte Live-Scans, Ignore, Notification create/update/dismiss und Optionsreload unter b0 bestanden mit unverändertem Integrationscode. Browserdarstellung und Recorder-Persistenz sind nicht zertifiziert. Frontend-generierte Strategy-Dashboards werden nicht aufgelöst: Ein leerer Scan/OK bestätigt nicht deren generierte Inhalte.<\/p>\n<p>Der integrierte Marketplace der November-Beta ist von HACS getrennt. Eine separate Marketplace-Installation des Dashboard Entity Checker wurde nicht geprüft; keine Marketplace-Zertifizierung behauptet. Dessen Community-Erweiterungs-Risikoerklärung vor Nutzung selbst lesen. Diese Dokumentations-/Teststandpflege enthält weder Versionsbump noch Runtimefix.<\/p>\n<h2>Technische Einordnung<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Eigenschaft<\/th><th>Wert<\/th><\/tr><\/thead><tbody><tr><td>Integrationstyp<\/td><td><code>service<\/code><\/td><\/tr><tr><td>IoT-Klasse<\/td><td><code>local_polling<\/code><\/td><\/tr><tr><td>Config Flow<\/td><td>ja, Version 2<\/td><\/tr><tr><td>Config Entries<\/td><td>eine pro Home-Assistant-Instanz<\/td><\/tr><tr><td>Abhängigkeiten<\/td><td><code>lovelace<\/code>, <code>persistent_notification<\/code><\/td><\/tr><tr><td>Plattform<\/td><td><code>sensor<\/code><\/td><\/tr><tr><td>Konfiguration<\/td><td>UI, kein YAML erforderlich<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Unterstützte Sprachen<\/h2>\n<p>Config Flow, Options Flow und Benachrichtigungstexte sind auf Deutsch und Englisch vorhanden. Interne Sensorstatuswerte wie <code>Fehler gefunden<\/code> stammen derzeit deutsch aus der Integration.<\/p>\n<h2>Netzwerk und Cloud<\/h2>\n<p>Der Scan läuft lokal in Home Assistant. Die Integration selbst benötigt für die Prüfung keine Cloud-Verbindung und sendet keine Dashboard-Inhalte an einen externen Dienst. HACS oder ein manueller Browser-Download benötigen selbstverständlich Zugriff auf GitHub, um die Dateien zu installieren.<\/p>\n<h2>Veröffentlichungsstand<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Version<\/th><th>Schwerpunkt<\/th><\/tr><\/thead><tbody><tr><td>0.3.6<\/td><td>native Optionen und Suche über alle Home-Assistant-Entities<\/td><\/tr><tr><td>0.3.5<\/td><td>vollständige Erkennung versehentlich angehängter Punkt-Suffixe<\/td><\/tr><tr><td>0.3.4<\/td><td>erweiterte Tests, Coverage-Grenze und Ruff-Prüfung<\/td><\/tr><tr><td>0.3.3<\/td><td>Projekt- und Integrationssymbol<\/td><\/tr><tr><td>0.3.2<\/td><td>kompakte deutsch/englisch gruppierte Benachrichtigungen<\/td><\/tr><tr><td>0.3.1<\/td><td>Ignore-Liste kann vollständig geleert werden<\/td><\/tr><tr><td>0.3.0<\/td><td>mehrere Dashboards, verschachtelte Decluttering-Auflösung und Result-Changed-Event<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Projektstatus<\/h2>\n<p>Das Repository ist öffentlich, aber noch nicht im Standard-HACS-Katalog. Bis dahin erfolgt die Installation als HACS-Custom-Repository oder manuell. Informationen zu einem zukünftigen v1.0- oder Standard-HACS-Termin sind keine feste Zusage.<\/p>"}, "en/index": {"title": "Dashboard Entity Checker", "html": "<h1>Dashboard Entity Checker<\/h1>\n<p><strong>Documentation for version 0.3.6<\/strong> · Home Assistant custom integration<\/p>\n<p>Dashboard Entity Checker scans selected Lovelace dashboards for entity references that exist in neither Home Assistant's state machine nor its entity registry.<\/p>\n<p>The integration reads dashboard configuration through Home Assistant's Python interfaces. It does not read or modify <code>.storage<\/code> files, execute JavaScript, or repair cards or entity IDs.<\/p>\n<h2>Why use this integration?<\/h2>\n<p>In complex custom dashboards, missing references can be hidden inside nested cards, Decluttering Card templates, or Button-Card JavaScript. Dashboard Entity Checker resolves the structures it explicitly supports and complements general maintenance tools such as <a href=\"https://spook.boo/\" rel=\"noopener noreferrer\">Spook<\/a>. It does not replace their wider Home Assistant checks and is not affiliated with Spook.<\/p>\n<h2>Main features<\/h2>\n<ul><li>scan one or more selected dashboards<\/li><li>collect direct entity IDs, supported Button-Card JavaScript references, and nested Decluttering templates<\/li><li>report complete locations by dashboard and view<\/li><li>transparently exclude intentionally missing exact entity IDs<\/li><li>provide a result sensor, an optional persistent notification, and a change event<\/li><li>expose partial dashboard failures without discarding valid results from other dashboards<\/li><li>provide redacted diagnostics for issue reports<\/li><\/ul>\n<h2>Quick start<\/h2>\n<ol><li><a href=\"#en/installation\" data-page-link=\"installation\">Install the integration<\/a>.<\/li><li><a href=\"#en/configuration\" data-page-link=\"configuration\">Configure dashboards and scan options<\/a>.<\/li><li>Inspect <code>sensor.dashboard_entity_checker<\/code> under <a href=\"#en/sensor\" data-page-link=\"sensor\">Result sensor<\/a>.<\/li><li>Run <code>dashboard_entity_checker.scan_now<\/code> when an immediate scan is needed.<\/li><\/ol>\n<p>The following topics cover setup, features, and troubleshooting. For a new installation, start with Installation, Configuration, and How it works.<\/p>\n<h2>Documentation<\/h2><div class=\"card-grid\"><a class=\"card\" href=\"#en/installation\" data-page-link=\"installation\"><strong>Installation<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/configuration\" data-page-link=\"configuration\"><strong>Configuration<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/how-it-works\" data-page-link=\"how-it-works\"><strong>How it works<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/supported-references\" data-page-link=\"supported-references\"><strong>Supported references<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/sensor\" data-page-link=\"sensor\"><strong>Result sensor<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/services\" data-page-link=\"services\"><strong>scan_now action<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/events\" data-page-link=\"events\"><strong>Events<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/notifications\" data-page-link=\"notifications\"><strong>Notifications<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/ignore-list\" data-page-link=\"ignore-list\"><strong>Exclusions<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/diagnostics\" data-page-link=\"diagnostics\"><strong>Diagnostics<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/limitations\" data-page-link=\"limitations\"><strong>Known limitations<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/troubleshooting\" data-page-link=\"troubleshooting\"><strong>Troubleshooting<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/requirements\" data-page-link=\"requirements\"><strong>Requirements<\/strong><span>Open<\/span><\/a><\/div>\n<h2>Security and privacy<\/h2>\n<p>Processing takes place locally in Home Assistant. Before publishing diagnostics, still review private dashboard names, URLs, and other sensitive details. Credentials must never be posted in issues or forum topics.<\/p>"}, "en/installation": {"title": "Installation", "html": "<h1>Installation<\/h1>\n<p>Dashboard Entity Checker is a custom integration. Version 0.3.6 is the current stable release and is not yet included in the default HACS catalog.<\/p>\n<h2>Requirements<\/h2>\n<ul><li>Home Assistant 2026.7.0 or newer<\/li><li>HACS 2.0.0 or newer for HACS installation<\/li><li>a Lovelace dashboard in storage mode or another dashboard Home Assistant can load through its Lovelace interfaces<\/li><\/ul>\n<h2>Install with HACS<\/h2>\n<p>The versions above are minimums; use current HACS. See <a href=\"#en/requirements\" data-page-link=\"requirements\">tested versions and beta Marketplace boundaries<\/a> for the distinct installation channels.<\/p>\n<p>HACS must already be installed and working.<\/p>\n<p><a href=\"https://my.home-assistant.io/redirect/hacs_repository/?owner=Dajwitt&amp;repository=dashboard-entity-checker&amp;category=integration\" rel=\"noopener noreferrer\">Open the custom repository in Home Assistant<\/a><\/p>\n<p>If the link does not work:<\/p>\n<ol><li>Open HACS in Home Assistant.<\/li><li>Open the three-dot menu in the top-right corner.<\/li><li>Select <strong>Custom repositories<\/strong>.<\/li><li>Enter this repository URL:<\/li><\/ol>\n<pre><code class=\"language-text\">https://github.com/Dajwitt/dashboard-entity-checker<\/code><\/pre>\n<ol start=\"5\"><li>Select category <strong>Integration<\/strong> and add the repository.<\/li><li>Open <strong>Dashboard Entity Checker<\/strong> in HACS and select <strong>Download<\/strong>.<\/li><li>Restart Home Assistant.<\/li><li>Continue with <a href=\"#en/configuration\" data-page-link=\"configuration\">Configuration<\/a>.<\/li><\/ol>\n<p>No entry in <code>configuration.yaml<\/code> is required.<\/p>\n<h2>Manual installation<\/h2>\n<ol><li>Download the latest GitHub release.<\/li><li>Ensure the final path looks exactly like this:<\/li><\/ol>\n<pre><code class=\"language-text\">/config/custom_components/dashboard_entity_checker/manifest.json<\/code><\/pre>\n<ol start=\"3\"><li>Copy <code>custom_components/dashboard_entity_checker<\/code> into <code>/config/custom_components/<\/code>.<\/li><li>Restart Home Assistant.<\/li><li>Continue with <a href=\"#en/configuration\" data-page-link=\"configuration\">Configuration<\/a>.<\/li><\/ol>\n<h2>Updating<\/h2>\n<p>For HACS installations, download the update through HACS and then restart Home Assistant. For manual installations, replace the complete integration directory with the directory from the new release and restart as well.<\/p>\n<p>Creating a Home Assistant backup before updating is recommended. The existing config entry is retained across updates.<\/p>\n<h2>Uninstalling<\/h2>\n<ol><li>Remove the integration under <strong>Settings → Devices &amp; services<\/strong>.<\/li><li>For a HACS installation, remove the repository through HACS; for a manual installation, delete the <code>dashboard_entity_checker<\/code> directory.<\/li><li>Restart Home Assistant.<\/li><\/ol>\n<p>Removing the integration does not modify any dashboards.<\/p>"}, "en/configuration": {"title": "Configuration", "html": "<h1>Configuration<\/h1>\n<p>Initial setup and later changes use Home Assistant's config flow and options flow. No YAML configuration is required.<\/p>\n<h2>Initial setup<\/h2>\n<p>After installation and restart:<\/p>\n<ol><li>Open <strong>Settings → Devices &amp; services<\/strong>.<\/li><li>Select <strong>Add integration<\/strong>.<\/li><li>Search for <strong>Dashboard Entity Checker<\/strong>.<\/li><li>Select at least one dashboard.<\/li><li>Set the scan interval between 1 and 1440 minutes; the default is 5 minutes.<\/li><li>Enable or disable persistent notifications.<\/li><li>Optionally search all Home Assistant entities and select or enter exact entity IDs to ignore.<\/li><\/ol>\n<p>Setup is rejected if no dashboard is selected, a selected dashboard cannot be loaded, or an ignored ID is syntactically invalid.<\/p>\n<h2>Configuration fields<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Default<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Dashboards<\/td><td>Multiple selection<\/td><td><code>my-ha-dashboard<\/code><\/td><td>Lovelace dashboards to scan<\/td><\/tr><tr><td>Scan interval<\/td><td>Integer 1–1440<\/td><td>5 minutes<\/td><td>Time between automatic scans<\/td><\/tr><tr><td>Notifications<\/td><td>On/off<\/td><td>On<\/td><td>Persistent notification for active findings<\/td><\/tr><tr><td>Ignored entity IDs<\/td><td>Searchable multiple selection<\/td><td>empty<\/td><td>Search all existing and registered entities or enter exact IDs freely<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>my-ha-dashboard<\/code> is only the integration's technical default. The selector lists dashboards available on the current Home Assistant instance.<\/p>\n<p>The entity selector combines the current state machine with the complete entity registry. It therefore also offers registered, disabled, unavailable, or currently stateless entities. Current checker findings and already saved ignore IDs remain visible; completely deleted IDs can be entered as a custom exact value.<\/p>\n<h2>Changing options<\/h2>\n<p>Open <strong>Settings → Devices &amp; services → Dashboard Entity Checker → Configure<\/strong>. Every field can be changed there. Saving reloads the config entry; the next scan immediately uses the new values.<\/p>\n<p>Disabling notifications removes the integration's existing persistent notification. The sensor and event remain active.<\/p>\n<h2>Single instance<\/h2>\n<p>Exactly one config entry is allowed per Home Assistant instance. That single entry can scan multiple dashboards.<\/p>\n<h2>Migrating older configuration<\/h2>\n<p>Version 1 config entries with one dashboard are automatically migrated to the version 2 multiple selection. The previously selected dashboard is retained.<\/p>"}, "en/how-it-works": {"title": "How it works", "html": "<h1>How it works<\/h1>\n<h2>Scan pipeline<\/h2>\n<pre><code class=\"language-text\">Home Assistant fully started\n        ↓\nload selected dashboards through Lovelace\n        ↓\nparse views and supported references\n        ↓\nresolve Decluttering templates and static JavaScript references\n        ↓\nmerge references by dashboard and view\n        ↓\ncheck the state machine and entity registry\n        ↓\napply the exact ignore list\n        ↓\nupdate sensor, adjust notification, optionally fire event<\/code><\/pre>\n<h2>Dashboard access<\/h2>\n<p>The integration uses Home Assistant's Lovelace Python interfaces and loads current configuration with a forced refresh. It does not access <code>.storage<\/code> directly and never writes to a dashboard. Only dashboards selected in the config entry are scanned.<\/p>\n<h2>When is an entity missing?<\/h2>\n<p>A reference is reported only when it is absent from both places:<\/p>\n<ul><li>no current state in Home Assistant's state machine<\/li><li>no entry in the entity registry<\/li><\/ul>\n<p>Therefore, <code>unavailable<\/code>, disabled, or temporarily stateless entities do not count as missing while a registry entry still exists.<\/p>\n<h2>Locations and deduplication<\/h2>\n<p>A missing ID is returned once, with every location retained:<\/p>\n<pre><code class=\"language-json\">{\n  &quot;entity&quot;: &quot;sensor.example_retired_temperature&quot;,\n  &quot;locations&quot;: [\n    {&quot;dashboard&quot;: &quot;example-main&quot;, &quot;views&quot;: [&quot;Overview&quot;, &quot;Climate&quot;]},\n    {&quot;dashboard&quot;: &quot;example-tablet&quot;, &quot;views&quot;: [&quot;Details&quot;]}\n  ]\n}<\/code><\/pre>\n<p>Dashboard values are URL paths; view values are visible titles. Multiple occurrences within the same view do not increase the finding count.<\/p>\n<h2>Automatic and manual scans<\/h2>\n<p>The first scan begins only after Home Assistant has fully started. Scans then repeat at the configured interval. <code>dashboard_entity_checker.scan_now<\/code> requests an immediate scan. Manual and scheduled scans are serialized and never overlap.<\/p>\n<h2>Partial failure<\/h2>\n<p>If at least one selected dashboard cannot be loaded, results from successfully loaded dashboards are retained. The sensor reports <code>Teilweise fehlgeschlagen<\/code> and exposes details in <code>dashboard_errors<\/code> and <code>last_error<\/code>.<\/p>\n<p>An incomplete scan does not change an existing finding notification and does not fire the result-changed event. This prevents a previous complete result from being replaced by incomplete data. The first subsequent complete scan becomes the new comparison baseline and also does not fire a change event yet.<\/p>\n<p>If none of the selected dashboards can be loaded, the coordinator update fails. The sensor remains available, reports the failed update, and retains the last successful data set while Home Assistant keeps it.<\/p>"}, "en/supported-references": {"title": "Supported references", "html": "<h1>Supported references<\/h1>\n<p>The checker inspects string values in loaded dashboard configuration. It detects direct entity IDs, supported static accesses in Button-Card JavaScript, and entity IDs produced by Decluttering Card template resolution.<\/p>\n<h2>Supported domains<\/h2>\n<pre><code class=\"language-text\">alarm_control_panel, automation, binary_sensor, button, calendar,\ncamera, climate, cover, device_tracker, fan, group, humidifier,\ninput_boolean, input_button, input_datetime, input_number,\ninput_select, input_text, light, lock, media_player, number,\nperson, remote, scene, script, select, sensor, switch,\ntimer, update, vacuum, weather, zone<\/code><\/pre>\n<h2>Direct references<\/h2>\n<p>A string that entirely resembles a supported entity ID is collected regardless of the surrounding YAML key:<\/p>\n<pre><code class=\"language-yaml\">type: entities\nentities:\n  - entity: sensor.example_room_temperature\n  - light.example_ceiling\nvariables:\n  - speaker: media_player.example_speaker<\/code><\/pre>\n<p>Values of the <code>service<\/code> and <code>perform_action<\/code> keys, card types, icons, URLs, and CSS values are filtered. The checker focuses on references and does not interpret every custom card's semantics. The modern direct <code>action<\/code> key currently has a <a href=\"#en/limitations\" data-page-link=\"limitations\">known limitation<\/a>.<\/p>\n<h2>Malformed extra dot suffixes<\/h2>\n<p>Since version 0.3.5, an otherwise entity-like scalar with an accidentally appended dot-separated suffix is collected as the complete malformed value:<\/p>\n<pre><code class=\"language-yaml\">variables:\n  - contact: binary_sensor.example_window_contact.example_door_contact<\/code><\/pre>\n<p>The checker reports <code>binary_sensor.example_window_contact.example_door_contact<\/code> as a missing reference. It does not shorten it to the potentially existing prefix <code>binary_sensor.example_window_contact<\/code>. This can happen when autocomplete is used in the middle of an entity ID.<\/p>\n<h2>Button-Card JavaScript<\/h2>\n<p>Blocks using <code>[[[ ... ]]]<\/code> are analyzed as text and are not executed. Supported forms include:<\/p>\n<pre><code class=\"language-javascript\">states[&#x27;sensor.example_humidity&#x27;]\nstates[&quot;binary_sensor.example_window&quot;]\nstates.light.example_ceiling<\/code><\/pre>\n<p>Static entity IDs in strings and comments inside the JavaScript block are also detected:<\/p>\n<pre><code class=\"language-javascript\">// Remove obsolete sensor.example_legacy_value\nreturn states[&#x27;sensor.example_humidity&#x27;].state;<\/code><\/pre>\n<p>Comments are deliberately scanned because stale references often remain there.<\/p>\n<h2>JavaScript filtering<\/h2>\n<p>The following are not treated as references, among other cases:<\/p>\n<ul><li>service or action values such as <code>service: sensor.example_placeholder<\/code><\/li><li>URLs such as <code>https://sensor.example.invalid/path<\/code><\/li><li>CSS selectors such as <code>.sensor.example_value<\/code><\/li><li>object properties such as <code>object.sensor.example_value<\/code><\/li><li>dynamic access through computed variables such as <code>states[entityId]<\/code><\/li><\/ul>\n<p>Explicit <code>states[...]<\/code> and <code>states.domain.object<\/code> access remains visible even in fields such as <code>styles<\/code>, <code>url<\/code>, or <code>icon<\/code>.<\/p>\n<h2>Decluttering Card templates<\/h2>\n<p>The checker reads <code>decluttering_templates<\/code>, substitutes <code>[[variable]]<\/code> placeholders, and scans the resulting card objects. Defaults are applied first and are overridden by values supplied by the card instance.<\/p>\n<pre><code class=\"language-yaml\">decluttering_templates:\n  example_security_row:\n    default:\n      - secondary: binary_sensor.example_secondary_contact\n    card:\n      type: entities\n      entities:\n        - &#x27;[[primary]]&#x27;\n        - &#x27;[[secondary]]&#x27;\n\nviews:\n  - title: Security\n    cards:\n      - type: custom:decluttering-card\n        template: example_security_row\n        variables:\n          - primary: binary_sensor.example_primary_contact<\/code><\/pre>\n<p>Both IDs are assigned to the <code>Security<\/code> view. Resolution supports complete nested card objects and recursive Decluttering calls up to 20 levels.<\/p>\n<h2>Template diagnostics<\/h2>\n<p>Resolution problems are reported separately under <code>template_diagnostics<\/code>:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Code<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>missing_template<\/code><\/td><td>template name is absent or does not exist<\/td><\/tr><tr><td><code>circular_template<\/code><\/td><td>circular template chain detected<\/td><\/tr><tr><td><code>max_template_depth<\/code><\/td><td>maximum depth of 20 reached<\/td><\/tr><tr><td><code>unknown_variable<\/code><\/td><td>required placeholder value is missing<\/td><\/tr><tr><td><code>invalid_variables<\/code><\/td><td>defaults or variables have an invalid structure<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A template diagnostic is not automatically a missing entity. The rest of the dashboard scan continues.<\/p>"}, "en/sensor": {"title": "Result sensor", "html": "<h1>Result sensor<\/h1>\n<p>The integration creates a sensor entity. Its default entity ID is <code>sensor.dashboard_entity_checker<\/code>; Home Assistant may assign a different ID after a naming conflict or manual rename.<\/p>\n<h2>State<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Value<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>0<\/code><\/td><td>no currently missing, non-ignored entity IDs<\/td><\/tr><tr><td>positive integer<\/td><td>number of unique active findings<\/td><\/tr><\/tbody><\/table><\/div>\n<p>During a partial dashboard failure, the numeric state still represents successfully loaded dashboards. For a complete assessment, also inspect <code>status<\/code>, <code>dashboard_loaded<\/code>, and <code>dashboard_errors<\/code>.<\/p>\n<h2>Attributes<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Attribute<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>dashboard<\/code><\/td><td>string<\/td><td>first configured dashboard, compatibility field<\/td><\/tr><tr><td><code>dashboards<\/code><\/td><td>list<\/td><td>all configured dashboard URL paths<\/td><\/tr><tr><td><code>dashboards_loaded<\/code><\/td><td>list<\/td><td>dashboards loaded successfully in the latest run<\/td><\/tr><tr><td><code>dashboard_errors<\/code><\/td><td>list<\/td><td>dashboards not loaded, with error messages<\/td><\/tr><tr><td><code>scan_interval_minutes<\/code><\/td><td>number<\/td><td>configured scan interval<\/td><\/tr><tr><td><code>dashboard_loaded<\/code><\/td><td>boolean<\/td><td><code>true<\/code> when every dashboard loaded<\/td><\/tr><tr><td><code>status<\/code><\/td><td>string<\/td><td>summarized run status<\/td><\/tr><tr><td><code>missing_entities<\/code><\/td><td>list<\/td><td>active missing IDs with locations<\/td><\/tr><tr><td><code>ignored_entities<\/code><\/td><td>list<\/td><td>configured exact ignored IDs<\/td><\/tr><tr><td><code>ignored_matches<\/code><\/td><td>list<\/td><td>IDs actually found but ignored<\/td><\/tr><tr><td><code>checked_entities<\/code><\/td><td>number<\/td><td>unique references before existence checks<\/td><\/tr><tr><td><code>templates_resolved<\/code><\/td><td>number<\/td><td>total resolved Decluttering templates<\/td><\/tr><tr><td><code>template_diagnostics<\/code><\/td><td>list<\/td><td>non-fatal resolution problems<\/td><\/tr><tr><td><code>views<\/code><\/td><td>object<\/td><td>loaded view titles per dashboard<\/td><\/tr><tr><td><code>views_scanned<\/code><\/td><td>number<\/td><td>total scanned views<\/td><\/tr><tr><td><code>last_scan<\/code><\/td><td>string<\/td><td>ISO timestamp of the last completed scan<\/td><\/tr><tr><td><code>last_error<\/code><\/td><td>string or <code>null<\/code><\/td><td>latest dashboard or coordinator error<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Finding example<\/h2>\n<pre><code class=\"language-json\">[\n  {\n    &quot;entity&quot;: &quot;sensor.example_retired_temperature&quot;,\n    &quot;locations&quot;: [\n      {&quot;dashboard&quot;: &quot;example-main&quot;, &quot;views&quot;: [&quot;Overview&quot;, &quot;Climate&quot;]},\n      {&quot;dashboard&quot;: &quot;example-tablet&quot;, &quot;views&quot;: [&quot;Details&quot;]}\n    ]\n  }\n]<\/code><\/pre>\n<h2>Status values<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Status<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>OK<\/code><\/td><td>complete scan without active findings<\/td><\/tr><tr><td><code>Fehler gefunden<\/code><\/td><td>complete scan with active findings<\/td><\/tr><tr><td><code>Teilweise fehlgeschlagen<\/code><\/td><td>at least one dashboard failed and at least one loaded<\/td><\/tr><tr><td><code>Fehler<\/code><\/td><td>latest coordinator update failed completely<\/td><\/tr><tr><td><code>Warte auf ersten Scan<\/code><\/td><td>integration loaded, first scan not completed<\/td><\/tr><\/tbody><\/table><\/div>\n<p>These status values currently come from the integration in German regardless of the selected UI language.<\/p>"}, "en/services": {"title": "`scan_now` action", "html": "<h1><code>scan_now<\/code> action<\/h1>\n<h2><code>dashboard_entity_checker.scan_now<\/code><\/h2>\n<p>This action immediately requests a scan of every configured dashboard. It has no parameters.<\/p>\n<h2>Developer Tools<\/h2>\n<p>Under <strong>Developer Tools → Actions<\/strong>:<\/p>\n<pre><code class=\"language-yaml\">action: dashboard_entity_checker.scan_now<\/code><\/pre>\n<h2>Script example<\/h2>\n<pre><code class=\"language-yaml\">script:\n  example_dashboard_check:\n    alias: &quot;Example: dashboard check&quot;\n    sequence:\n      - action: dashboard_entity_checker.scan_now<\/code><\/pre>\n<h2>Automation example<\/h2>\n<pre><code class=\"language-yaml\">automation:\n  - alias: &quot;Example: request dashboard check&quot;\n    triggers:\n      - trigger: time\n        at: &quot;03:15:00&quot;\n    actions:\n      - action: dashboard_entity_checker.scan_now<\/code><\/pre>\n<p>This automation is unnecessary for normal use because the integration already scans automatically at the configured interval.<\/p>\n<h2>Execution and errors<\/h2>\n<p>A manual request waits for an already running scan; parallel scans are prevented. If none of the selected dashboards can be loaded or the coordinator update fails completely, the action call fails with a Home Assistant error.<\/p>\n<p>During a partial failure, the action completes successfully. Details then appear in <code>dashboard_errors<\/code> and <code>last_error<\/code>.<\/p>"}, "en/events": {"title": "Events", "html": "<h1>Events<\/h1>\n<h2><code>dashboard_entity_checker_result_changed<\/code><\/h2>\n<p>After a complete baseline scan, the integration fires this event when the complete active result changes.<\/p>\n<h2>When is it fired?<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Situation<\/th><th>Event<\/th><\/tr><\/thead><tbody><tr><td>active result changes after baseline<\/td><td>yes<\/td><\/tr><tr><td>result remains identical<\/td><td>no<\/td><\/tr><tr><td>first complete scan establishes baseline<\/td><td>no<\/td><\/tr><tr><td>at least one dashboard could not be loaded<\/td><td>no<\/td><\/tr><tr><td>only <code>ignored_matches<\/code> changes while active list stays equal<\/td><td>no<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A location change counts because <code>missing_entities<\/code>, including locations, is compared. In that case, <code>added_entities<\/code> and <code>removed_entities<\/code> can both be empty.<\/p>\n<h2>Event data<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>dashboards<\/code><\/td><td>list<\/td><td>configured dashboard URL paths<\/td><\/tr><tr><td><code>previous_count<\/code><\/td><td>number<\/td><td>previous count of active IDs<\/td><\/tr><tr><td><code>current_count<\/code><\/td><td>number<\/td><td>current count of active IDs<\/td><\/tr><tr><td><code>added_entities<\/code><\/td><td>list<\/td><td>newly missing IDs, sorted<\/td><\/tr><tr><td><code>removed_entities<\/code><\/td><td>list<\/td><td>IDs no longer missing, sorted<\/td><\/tr><tr><td><code>missing_entities<\/code><\/td><td>list<\/td><td>complete current result with locations<\/td><\/tr><tr><td><code>scan_time<\/code><\/td><td>string<\/td><td>ISO timestamp of the scan<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Automation example<\/h2>\n<pre><code class=\"language-yaml\">automation:\n  - alias: &quot;Example: dashboard findings changed&quot;\n    triggers:\n      - trigger: event\n        event_type: dashboard_entity_checker_result_changed\n    conditions:\n      - condition: template\n        value_template: &quot;{{ trigger.event.data.added_entities | count &gt; 0 }}&quot;\n    actions:\n      - action: persistent_notification.create\n        data:\n          title: &quot;New dashboard references&quot;\n          message: &gt;\n            {{ trigger.event.data.added_entities | join(&#x27;, &#x27;) }}<\/code><\/pre>\n<p>The example deliberately avoids a device-specific notify action. Production automations should also account for location-only changes that fire an event without added or removed IDs. After a partial scan, the next complete scan is treated as a new comparison baseline and also does not fire an event yet.<\/p>"}, "en/notifications": {"title": "Notifications", "html": "<h1>Notifications<\/h1>\n<p>When enabled, the integration manages one persistent notification with the fixed ID <code>dashboard_entity_checker_missing_entities<\/code>.<\/p>\n<h2>Behavior<\/h2>\n<ul><li>A complete scan with findings creates or updates the notification.<\/li><li>An identical result causes no unnecessary update.<\/li><li>A complete clean scan dismisses it.<\/li><li>Disabling the option also dismisses it.<\/li><li>A partial scan does not modify the existing notification.<\/li><li>Title and message are German or English according to Home Assistant's language.<\/li><\/ul>\n<h2>Grouping<\/h2>\n<p>The message groups findings by dashboard and view. Each view shows at most eight entity IDs; additional findings are summarized by a remaining count. The complete unabridged list remains in the <code>missing_entities<\/code> sensor attribute.<\/p>\n<pre><code class=\"language-text\">Dashboard Entity Checker: 2 missing entities\n\n2 missing entities in 3 views\n\n### `example-main`\n\n**Overview** · 1\n- `sensor.example_retired_temperature`\n\n**Security** · 1\n- `binary_sensor.example_old_contact`\n\n### `example-tablet`\n\n**Details** · 1\n- `sensor.example_retired_temperature`\n\nComplete list: sensor attribute `missing_entities`.<\/code><\/pre>\n<p>The number in the title counts unique active entity IDs. The same ID can appear at multiple locations below it.<\/p>\n<h2>Partial failures<\/h2>\n<p>If a selected dashboard cannot be loaded, the result is incomplete. An existing finding notification is therefore neither dismissed nor overwritten with the partial result. The partial failure itself is exposed by the result sensor and diagnostics.<\/p>\n<h2>No duplicate stream<\/h2>\n<p>The integration always uses the same notification ID. It does not create a new notification at every interval. Users who need additional push messages can consume the result-changed event in their own automation.<\/p>"}, "en/ignore-list": {"title": "Exclusions", "html": "<h1>Exclusions<\/h1>\n<p>Exact entity IDs that intentionally should not appear as active findings can be selected or entered in the config flow or options flow.<\/p>\n<h2>Selection<\/h2>\n<p>The searchable multiple-selection field contains:<\/p>\n<ul><li>every entity ID from Home Assistant's current state machine,<\/li><li>every entity-registry entry, including registered entities without a current state,<\/li><li>current and previously ignored checker findings plus saved ignore IDs.<\/li><\/ul>\n<p>Search by domain, object ID, or a complete value and select each required entry. If an ID no longer exists, enter it completely and choose <strong>Add custom item<\/strong>:<\/p>\n<pre><code class=\"language-text\">sensor.example_intentionally_missing<\/code><\/pre>\n<p>Every saved value must be a syntactically valid Home Assistant entity ID. Duplicates are removed. The ID does not need to exist; that is why free exact entry remains available.<\/p>\n<h2>Exact matching<\/h2>\n<p>Exclusions apply only to the complete ID. Wildcards, regular expressions, domain filters, and substring matching are not supported.<\/p>\n<pre><code class=\"language-text\">sensor.example_room<\/code><\/pre>\n<p>does not ignore <code>sensor.example_room_temperature<\/code>.<\/p>\n<h2>Transparency<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Attribute<\/th><th>Content<\/th><\/tr><\/thead><tbody><tr><td><code>missing_entities<\/code><\/td><td>active, non-ignored findings<\/td><\/tr><tr><td><code>ignored_entities<\/code><\/td><td>complete configured list<\/td><\/tr><tr><td><code>ignored_matches<\/code><\/td><td>IDs currently found and excluded, with locations<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A configured ID that is not missing appears only under <code>ignored_entities<\/code>, not under <code>ignored_matches<\/code>.<\/p>\n<h2>Example<\/h2>\n<pre><code class=\"language-json\">{\n  &quot;missing_entities&quot;: [\n    {&quot;entity&quot;: &quot;sensor.example_active_problem&quot;, &quot;locations&quot;: []}\n  ],\n  &quot;ignored_entities&quot;: [&quot;binary_sensor.example_expected_missing&quot;],\n  &quot;ignored_matches&quot;: [\n    {&quot;entity&quot;
