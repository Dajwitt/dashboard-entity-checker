: &quot;binary_sensor.example_expected_missing&quot;, &quot;locations&quot;: []}\n  ]\n}<\/code><\/pre>\n<h2>Clearing the list<\/h2>\n<p>Clear the options-flow field completely and save. The integration then removes every exclusion. If notifications are enabled, the next complete scan updates the result accordingly.<\/p>"}, "en/diagnostics": {"title": "Diagnostics", "html": "<h1>Diagnostics<\/h1>\n<p>Diagnostics are generated under <strong>Settings → Devices &amp; services → Dashboard Entity Checker → three-dot menu → Download diagnostics<\/strong>. They contain configuration and the latest scan result in a format intended for issue reports.<\/p>\n<h2>Included data<\/h2>\n<ul><li>integration version<\/li><li>configured, loaded, and failed dashboards<\/li><li>scan interval and loading state<\/li><li>views and number of checked references<\/li><li>active findings, configured exclusions, and <code>ignored_matches<\/code><\/li><li>resolved Decluttering templates and template diagnostics<\/li><li>timestamp and error text from the latest scan<\/li><\/ul>\n<p>If the coordinator is unavailable when diagnostics are downloaded, the integration returns a reduced data set containing configuration values, empty result lists, and the message <code>Coordinator ist nicht verfügbar.<\/code><\/p>\n<h2>Example excerpt<\/h2>\n<pre><code class=\"language-json\">{\n  &quot;integration_version&quot;: &quot;0.3.6&quot;,\n  &quot;dashboards&quot;: [&quot;example-main&quot;, &quot;example-tablet&quot;],\n  &quot;dashboards_loaded&quot;: [&quot;example-main&quot;],\n  &quot;dashboard_errors&quot;: [\n    {&quot;dashboard&quot;: &quot;example-tablet&quot;, &quot;error&quot;: &quot;Dashboard could not be loaded&quot;}\n  ],\n  &quot;entities_checked&quot;: 42,\n  &quot;missing_entities&quot;: [\n    {\n      &quot;entity&quot;: &quot;sensor.example_retired_temperature&quot;,\n      &quot;locations&quot;: [\n        {&quot;dashboard&quot;: &quot;example-main&quot;, &quot;views&quot;: [&quot;Climate&quot;]}\n      ]\n    }\n  ],\n  &quot;template_diagnostics&quot;: []\n}<\/code><\/pre>\n<h2>Redaction<\/h2>\n<p>Fields named <code>access_token<\/code>, <code>token<\/code>, and <code>password<\/code> are redacted through Home Assistant's diagnostics helper. This is an additional safeguard and does not replace manual review.<\/p>\n<h2>Before uploading<\/h2>\n<ul><li>Read the complete file.<\/li><li>Anonymize private dashboard names, view titles, and entity IDs when needed.<\/li><li>Never publish tokens, passwords, private URLs, or internal network addresses.<\/li><li>Include the integration version, Home Assistant version, and clear reproduction steps in the issue.<\/li><\/ul>"}, "en/limitations": {"title": "Known limitations", "html": "<h1>Known limitations<\/h1>\n<h2>JavaScript is not executed<\/h2>\n<p>Button-Card JavaScript is inspected statically as text. Static access such as <code>states['sensor.example_humidity']<\/code> is visible. Dynamically created IDs cannot be calculated safely:<\/p>\n<pre><code class=\"language-javascript\">const entityId = `sensor.${room}_temperature`;\nreturn states[entityId].state;<\/code><\/pre>\n<p>The checker does not execute JavaScript or evaluate variables, functions, or runtime conditions.<\/p>\n<h2>Comments are scanned<\/h2>\n<p>Entity-like values in JavaScript comments are deliberately collected. A commented-out obsolete reference can therefore appear as a finding. Remove it from the dashboard or deliberately place the exact ID on the ignore list.<\/p>\n<h2>Custom cards<\/h2>\n<p>Direct static entity IDs in custom-card configuration can be detected. Proprietary reference formats, external files, or IDs created only by a custom card's JavaScript cannot be resolved generically.<\/p>\n<h2>Direct <code>action<\/code> key<\/h2>\n<p>The direct scalar keys <code>service<\/code> and <code>perform_action<\/code> are skipped as service names. The newer <code>action<\/code> key is not currently excluded in the same way in ordinary dashboard objects. An entity-like action name such as <code>light.example_turn_on<\/code> can therefore be reported incorrectly as an entity reference. Until the parser treats these keys consistently, inspect such a finding manually at its reported dashboard location.<\/p>\n<h2>Decluttering Card<\/h2>\n<ul><li>only <code>decluttering_templates<\/code> present in the loaded dashboard configuration can be resolved<\/li><li>unknown variables are diagnosed rather than guessed<\/li><li>circular calls are stopped<\/li><li>maximum recursive depth is 20<\/li><li><code>[[variable]]<\/code> is supported; Button-Card JavaScript <code>[[[ ... ]]]<\/code> uses a separate analysis path<\/li><\/ul>\n<h2>Existence check<\/h2>\n<p>An entity with a registry entry does not count as missing, even when disabled, <code>unavailable<\/code>, or lacking a current state. The integration checks reference existence, not availability or device health.<\/p>\n<h2>No repair function<\/h2>\n<p>The checker does not write dashboard configuration or offer automatic corrections. The location and complete ID are intended to support a manual, controlled repair.<\/p>\n<h2>Not a complete Home Assistant audit<\/h2>\n<p>Only selected dashboards and explicitly supported reference forms are checked. Automations, scripts, template helpers, and other Home Assistant configuration are outside this project's scope.<\/p>"}, "en/troubleshooting": {"title": "Troubleshooting", "html": "<h1>Troubleshooting<\/h1>\n<h2>Sensor remains at <code>Warte auf ersten Scan<\/code><\/h2>\n<p>The first scan starts only after Home Assistant has fully started. This state is normal shortly after a restart. If it persists, run <code>dashboard_entity_checker.scan_now<\/code> under <strong>Developer Tools → Actions<\/strong> and inspect the Home Assistant logs.<\/p>\n<h2><code>dashboard_errors<\/code> contains entries<\/h2>\n<ol><li>Inspect <code>last_error<\/code> and the individual error message.<\/li><li>Confirm the dashboard URL path still exists.<\/li><li>Open the dashboard in Home Assistant.<\/li><li>Open the integration options and remove or reselect an invalid entry.<\/li><li>Scan again.<\/li><\/ol>\n<p>Results from other dashboards remain visible during partial failures, but they are not a complete overall scan.<\/p>\n<h2><code>template_diagnostics<\/code> contains entries<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Code<\/th><th>Typical cause<\/th><\/tr><\/thead><tbody><tr><td><code>missing_template<\/code><\/td><td>name is missing or template was renamed<\/td><\/tr><tr><td><code>circular_template<\/code><\/td><td>templates invoke each other recursively<\/td><\/tr><tr><td><code>max_template_depth<\/code><\/td><td>chain exceeds 20 levels<\/td><\/tr><tr><td><code>unknown_variable<\/code><\/td><td>required variable or default is missing<\/td><\/tr><tr><td><code>invalid_variables<\/code><\/td><td><code>default<\/code> or <code>variables<\/code> has an invalid structure<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The diagnostic identifies the dashboard, view, template, and when possible the variable or detail. Inspect that source configuration; the checker does not modify it.<\/p>\n<h2>Expected missing ID is not reported<\/h2>\n<ul><li>The ID still has an entity-registry entry.<\/li><li>The ID is listed in <code>ignored_entities<\/code>; a real match appears in <code>ignored_matches<\/code>.<\/li><li>The affected dashboard is not selected or could not be loaded.<\/li><li>The reference is generated dynamically or uses an unsupported custom-card format.<\/li><li>The ID uses an unsupported domain.<\/li><\/ul>\n<p>See <a href=\"#en/supported-references\" data-page-link=\"supported-references\">Supported references<\/a> and <a href=\"#en/limitations\" data-page-link=\"limitations\">Known limitations<\/a>.<\/p>\n<h2>Clearly malformed value is only partially detected<\/h2>\n<p>Install version 0.3.5 or newer. This version handles accidentally appended dot suffixes as the complete malformed scalar. Restart Home Assistant after updating and run a manual scan.<\/p>\n<h2>Entity-like action name is reported<\/h2>\n<p>Direct values under the modern dashboard key <code>action<\/code> are not currently excluded like <code>service<\/code> and <code>perform_action<\/code>. For example, <code>light.example_turn_on<\/code> can appear as a missing entity. Inspect the reported location; this behavior is documented under <a href=\"#en/limitations\" data-page-link=\"limitations\">Known limitations<\/a>.<\/p>\n<h2>Notification is absent or unchanged<\/h2>\n<ul><li>Check the notification option.<\/li><li>Inspect <code>missing_entities<\/code>.<\/li><li>During a partial failure, the previous notification deliberately remains unchanged.<\/li><li>An identical complete result causes no unnecessary update.<\/li><\/ul>\n<h2>Creating an issue report<\/h2>\n<ol><li>Install the latest version and restart Home Assistant.<\/li><li>Run a manual scan.<\/li><li>Inspect sensor attributes and Home Assistant logs.<\/li><li>Download and redact <a href=\"#en/diagnostics\" data-page-link=\"diagnostics\">Diagnostics<\/a>.<\/li><li>Open an issue under <a href=\"https://github.com/Dajwitt/dashboard-entity-checker/issues\" rel=\"noopener noreferrer\">GitHub Issues<\/a> with clear steps and the expected result.<\/li><\/ol>\n<p>Do not publicly post credentials, private URLs, or real private entity IDs.<\/p>"}, "en/requirements": {"title": "Requirements", "html": "<h1>Requirements<\/h1>\n<h2>Supported versions<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Component<\/th><th>Minimum version<\/th><\/tr><\/thead><tbody><tr><td>Home Assistant<\/td><td>2026.7.0<\/td><\/tr><tr><td>HACS for HACS installation<\/td><td>2.0.0<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Version 0.3.6 is the current stable release.<\/p>\n<p>The table lists retained minimums, not the newest tested versions; use a current HACS release. Regular CI uses HA <strong>2026.10.4<\/strong>, replacing the old 2026.7.2 test pin. Separate real-Core tests on <strong>2026.11.0b0/b1<\/strong> each passed 87 existing tests and 7 runtime tests (94 passed, 96.32% coverage). Both November versions remain beta. No incompatible October HA pytest plugin was forced into those environments. CI also repeats the 87 existing tests on b0/b1; the additional seven real-Core harness tests remain a separate local acceptance, not part of that CI count.<\/p>\n<p>Targeted live b0 scans, ignore behavior, notification create/update/dismiss and options reload passed with unchanged integration code. Browser rendering and Recorder persistence are not certified. Frontend-generated Strategy dashboards are not resolved: an empty scan/OK does not certify their generated contents.<\/p>\n<p>HA November beta's built-in Marketplace is separate from HACS. A separate Dashboard Entity Checker Marketplace installation was not tested; this is not a claim of Marketplace certification. Read its community-extension risk notice yourself before using that alternative. No version bump or runtime fix accompanies this documentation/test-baseline maintenance.<\/p>\n<h2>Technical classification<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Property<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Integration type<\/td><td><code>service<\/code><\/td><\/tr><tr><td>IoT class<\/td><td><code>local_polling<\/code><\/td><\/tr><tr><td>Config flow<\/td><td>yes, version 2<\/td><\/tr><tr><td>Config entries<\/td><td>one per Home Assistant instance<\/td><\/tr><tr><td>Dependencies<\/td><td><code>lovelace<\/code>, <code>persistent_notification<\/code><\/td><\/tr><tr><td>Platform<\/td><td><code>sensor<\/code><\/td><\/tr><tr><td>Configuration<\/td><td>UI, no YAML required<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Supported languages<\/h2>\n<p>Config flow, options flow, and notification messages are available in German and English. Internal sensor status values such as <code>Fehler gefunden<\/code> currently remain German regardless of UI language.<\/p>\n<h2>Network and cloud<\/h2>\n<p>Scanning runs locally in Home Assistant. The integration itself requires no cloud connection for checking and sends no dashboard content to an external service. HACS or a manual browser download naturally requires GitHub access to install files.<\/p>\n<h2>Release history<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Version<\/th><th>Focus<\/th><\/tr><\/thead><tbody><tr><td>0.3.6<\/td><td>native options and search across all Home Assistant entities<\/td><\/tr><tr><td>0.3.5<\/td><td>complete detection of accidentally appended dot suffixes<\/td><\/tr><tr><td>0.3.4<\/td><td>expanded tests, coverage threshold, and Ruff checks<\/td><\/tr><tr><td>0.3.3<\/td><td>project and integration icon<\/td><\/tr><tr><td>0.3.2<\/td><td>compact grouped German and English notifications<\/td><\/tr><tr><td>0.3.1<\/td><td>ignore list can be cleared completely<\/td><\/tr><tr><td>0.3.0<\/td><td>multiple dashboards, nested Decluttering resolution, and result-changed event<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Project status<\/h2>\n<p>The repository is public but is not yet in the default HACS catalog. Until then, install it as a HACS custom repository or manually. Any future v1.0 or default-catalog date is not a firm commitment.<\/p>"}}, "navigation": {"de": [{"group": "Start", "items": [{"slug": "index", "title": "Übersicht"}]}, {"group": "Erste Schritte", "items": [{"slug": "installation", "title": "Installation"}, {"slug": "configuration", "title": "Konfiguration"}, {"slug": "how-it-works", "title": "Funktionsweise"}]}, {"group": "Funktionen", "items": [{"slug": "supported-references", "title": "Unterstützte Referenzen"}, {"slug": "sensor", "title": "Result-Sensor"}, {"slug": "services", "title": "Aktion scan_now"}, {"slug": "events", "title": "Events"}, {"slug": "notifications", "title": "Benachrichtigungen"}, {"slug": "ignore-list", "title": "Ausschlüsse"}, {"slug": "diagnostics", "title": "Diagnostik"}]}, {"group": "Referenz", "items": [{"slug": "limitations", "title": "Bekannte Grenzen"}, {"slug": "troubleshooting", "title": "Fehlerbehebung"}, {"slug": "requirements", "title": "Anforderungen"}]}], "en": [{"group": "Start", "items": [{"slug": "index", "title": "Overview"}]}, {"group": "Getting started", "items": [{"slug": "installation", "title": "Installation"}, {"slug": "configuration", "title": "Configuration"}, {"slug": "how-it-works", "title": "How it works"}]}, {"group": "Features", "items": [{"slug": "supported-references", "title": "Supported references"}, {"slug": "sensor", "title": "Result sensor"}, {"slug": "services", "title": "scan_now action"}, {"slug": "events", "title": "Events"}, {"slug": "notifications", "title": "Notifications"}, {"slug": "ignore-list", "title": "Exclusions"}, {"slug": "diagnostics", "title": "Diagnostics"}]}, {"group": "Reference", "items": [{"slug": "limitations", "title": "Known limitations"}, {"slug": "troubleshooting", "title": "Troubleshooting"}, {"slug": "requirements", "title": "Requirements"}]}]}, "ui": {"de": {"open": "Öffnen", "toc": "Auf dieser Seite", "search": "Dokumentation filtern", "light": "Hell", "dark": "Dunkel", "menu": "Menü", "brand": "Dokumentation · v0.3.6", "site_title": "Dokumentation"}, "en": {"open": "Open", "toc": "On this page", "search": "Filter documentation", "light": "Light", "dark": "Dark", "menu": "Menu", "brand": "Documentation · v0.3.6", "site_title": "Documentation"}}},pages=data.pages,navigation=data.navigation,ui=data.ui;let currentLanguage='en',currentSlug='index';
function slugify(value){return value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function renderNavigation(language){document.getElementById('navigation').innerHTML=navigation[language].map(group=>`<section class="nav-group"><h2>${group.group}</h2>${group.items.map(item=>`<a href="#${language}/${item.slug}" data-page="${item.slug}">${item.title}</a>`).join('')}</section>`).join('');document.getElementById('search').placeholder=ui[language].search;document.querySelectorAll('#navigation a').forEach(a=>a.addEventListener('click',()=>document.getElementById('sidebar').classList.remove('open')))}
function loadPage(language,slug,section=null){const key=`${language}/${slug}`;if(!pages[key]){language='en';slug='index'}currentLanguage=language;currentSlug=slug;localStorage.setItem('dec-doc-language',language);document.documentElement.lang=language;renderNavigation(language);document.getElementById('light').textContent=ui[language].light;document.getElementById('dark').textContent=ui[language].dark;document.getElementById('menu').textContent=ui[language].menu;document.getElementById('brand-subtitle').textContent=ui[language].brand;const page=pages[`${language}/${slug}`];document.title=(slug==='index'?ui[language].site_title:page.title)+' – Dashboard Entity Checker';const content=document.getElementById('content');content.innerHTML=page.html;document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===slug));content.querySelectorAll('[data-page-link]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();location.hash=`${language}/${a.dataset.pageLink}`}));const headings=[...content.querySelectorAll('h2')];headings.forEach((h,i)=>h.id=slugify(h.textContent)||'section-'+i);document.getElementById('toc').innerHTML=`<strong>${ui[language].toc}</strong>`+headings.map(h=>`<a href="#${language}/${slug}:${h.id}">${h.textContent}</a>`).join('');document.querySelectorAll('[id^="lang-"]').forEach(b=>b.classList.toggle('active',b.id===`lang-${language}`));if(section){document.getElementById(section)?.scrollIntoView({behavior:'instant',block:'start'})}else{window.scrollTo(0,0)}}
function route(){const [path,section]=location.hash.slice(1).split(':',2);if(path.includes('/')){const [language,slug]=path.split('/',2);loadPage(language,slug,section||null)}else{const saved=localStorage.getItem('dec-doc-language');const detected=navigator.language.toLowerCase().startsWith('de')?'de':'en';const language=saved&&navigation[saved]?saved:detected;location.replace(`#${language}/index`)}}
function switchLanguage(language){location.hash=`${language}/${currentSlug}`}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function setTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('dec-doc-theme',theme);document.querySelectorAll('#light,#dark').forEach(b=>b.classList.toggle('active',b.id===theme))}
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.nav-group').forEach(group=>{let visible=0;group.querySelectorAll('a').forEach(a=>{const show=a.textContent.toLowerCase().includes(q);a.style.display=show?'block':'none';visible+=show});group.style.display=visible?'block':'none'})});window.addEventListener('hashchange',route);setTheme(localStorage.getItem('dec-doc-theme')||'light');route();
</script></body></html>
